*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
html{scrollbar-width:thin;scrollbar-color:#c9c5b6 var(--paper)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9c5b6;border:2px solid var(--paper);border-radius:6px}
::-webkit-scrollbar-track{background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button,a,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.5;cursor:wait}
a{color:inherit;text-underline-offset:4px}
input,textarea{caret-color:var(--purple)}
::selection{background:#e6d3ef}
:focus-visible{outline:2px solid var(--purple);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.35;letter-spacing:-.03em;text-wrap:balance;word-break:keep-all}
h1{font-family:"Display",var(--sans);font-size:34px;font-weight:900}
h2{font-size:21px;font-weight:700}
h3{font-size:15px;font-weight:700}
p,li{word-break:keep-all;overflow-wrap:anywhere}
code,pre{font:12px/1.8 var(--mono)}
code{padding:2px 5px;background:var(--tint);border-radius:2px;overflow-wrap:anywhere}
pre{margin:0;overflow:auto;padding:18px 20px;tab-size:2}
pre code{padding:0;background:transparent;overflow-wrap:normal}
.muted{color:var(--muted)}.small{font-size:12px}
.skip{position:absolute;top:-80px;left:18px;z-index:30;background:#fff;padding:10px;border:1px solid var(--ink)}
.skip:focus{top:10px}
.icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.course-sub{font:700 10px/1.4 var(--cond);letter-spacing:.06em;color:var(--muted);white-space:nowrap}
/* header */
.header{background:var(--card);border-bottom:2px solid var(--ink)}
.header-inner{max-width:1280px;margin:auto;padding:0 28px;height:64px;display:flex;align-items:center;gap:38px}
.brand{font:900 24px/1 "Display",var(--cond);letter-spacing:-.02em;text-decoration:none;text-transform:lowercase}
.brand span{color:var(--purple)}
.nav{display:flex;gap:24px;align-self:stretch;align-items:stretch}
.nav a{font-size:13px;font-weight:600;text-decoration:none;color:var(--muted);display:flex;align-items:center;border-bottom:3px solid transparent;margin-bottom:-2px;padding-top:2px}
.nav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--purple)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px}
.account{color:var(--muted)}
.prototype{font:700 9px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:4px 7px;border-radius:2px}
.avatar-link{width:38px;height:38px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:var(--ink);text-decoration:none}
.avatar-link:hover{background:var(--yellow-tint)}
.avatar-link[aria-current=page]{outline:2px solid var(--purple);outline-offset:2px}
.avatar-link svg{width:18px;height:18px}
.header-login{font-size:13px;font-weight:600;text-decoration:none;padding:4px 0}
.header-login:hover{text-decoration:underline}
/* shell */
.page{max-width:1280px;margin:auto;padding:26px 28px 0;min-height:520px}
.page:focus{outline:0}
.footer{max-width:1280px;margin:40px auto 0;padding:0 28px 28px;font-size:11px;color:var(--muted)}
.footer-inner{border-top:2px solid var(--ink);padding-top:14px;display:flex;justify-content:space-between;gap:24px;align-items:start}
.tools summary{cursor:pointer;list-style-position:inside;font-weight:700}
.tools[open]{max-width:420px}
.tools-actions{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}
.tools button{font-size:11px;padding:0;text-decoration:underline;text-underline-offset:3px}
.tools select{max-width:100%;font-size:11px;padding:3px;background:#fff;border:1px solid var(--line);border-radius:2px}
.tools label{font-size:11px}
.simulation-options{display:grid;gap:6px;margin:8px 0}
.storage-error{color:var(--red);font-size:11px;margin-top:8px}
/* controls */
.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--control);padding:10px 18px;font-size:13px;font-weight:700;border-radius:var(--r);border:1px solid var(--ink);line-height:1.5;text-decoration:none;white-space:nowrap;transition:background-color .14s ease,border-color .14s ease,color .14s ease}
.primary{background:var(--ink);color:#fff}
.primary:hover{background:var(--ink-2)}
.primary:active{background:#000}
.secondary{background:var(--card)}
.secondary:hover{background:var(--tint)}
.link-button{display:inline-flex;align-items:center;min-height:34px;padding:2px 0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:4px;text-align:left}
.link-button:hover{color:var(--ink)}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:16px;margin-top:24px}
.tag{display:inline-flex;align-items:center;gap:6px;font:700 10px/1.4 var(--cond);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:2px;background:var(--purple-tint);color:var(--purple-deep)}
.tag.olive{background:var(--olive-tint);color:var(--olive-deep)}
.tag.yellow{background:var(--yellow-tint);color:#7a6112}
.tag.red{background:var(--red-tint);color:var(--red)}
.meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font:700 10.5px/1.4 var(--cond);letter-spacing:.04em;color:var(--muted)}
.divider{height:1px;background:var(--line);margin:22px 0}
.error{color:var(--red);font-size:12px;margin-top:8px}
.error:empty{display:none}
.notice{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.7}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r);font-size:12px;z-index:20;max-width:calc(100vw - 30px);box-shadow:0 5px 20px #0002}
.toast:empty{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin:30px 0 12px}
.section-head h2{font-size:17px}
.section-head span{font:700 10px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* landing */
.entry{display:grid;grid-template-columns:minmax(0,.84fr) minmax(0,1.16fr);gap:52px;align-items:start;padding:24px 0 14px}
.entry-copy{padding-top:34px}
.entry-copy h1{font-size:46px;line-height:1.26;letter-spacing:-.04em;max-width:520px;margin-top:10px}
.entry-copy h1 em{font-style:normal;color:var(--purple)}
.entry-copy>p{font-size:15px;line-height:1.9;color:var(--muted);margin-top:20px;max-width:46ch}
.entry-copy .primary{margin-top:26px;padding:12px 22px}
.entry-copy .notice{font-size:12px;margin-top:12px}
.entry-process{margin-top:30px;border-top:2px solid var(--ink);padding-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;font-size:11.5px;color:var(--muted)}
.entry-process strong{display:block;color:var(--ink);font-size:12px;margin-bottom:4px}
.entry-example{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.example-head{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);font:700 10px/1.4 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.example-map{background:#fff;border-bottom:1px solid var(--line)}
.example-map svg{display:block;width:100%;height:auto}
.example-body{padding:18px 20px}
.example-body h2{font-size:24px;margin:9px 0 7px}
.example-body p{color:var(--muted);font-size:12.5px;line-height:1.75}
.example-code{background:#20241e;border:1px solid #2f352c;border-radius:2px;margin-top:14px;color:#e7ebdf}
.example-code pre{padding:13px 16px;font-size:11px;line-height:1.7}
.example-bottom{padding:13px 18px;background:var(--purple-tint);font-size:11px;color:var(--purple-deep);border-top:1px solid #e3d0ec}
/* onboarding */
.onboarding{display:grid;grid-template-columns:280px minmax(0,1fr);gap:56px;max-width:1040px;margin:8px auto 0}
.onboard-aside{padding-top:6px}
.onboard-aside h1{font-size:28px;max-width:280px}
.onboard-aside>p{font-size:13px;color:var(--muted);margin-top:14px}
.step-list{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:18px}
.step-list li{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}
.step-number{width:26px;height:26px;display:grid;place-items:center;border:1px solid #c8c4b6;border-radius:50%;font:700 11px var(--cond)}
.step-list li.current{color:var(--ink);font-weight:700}
.step-list li.current .step-number{background:var(--purple);color:#fff;border-color:var(--purple)}
.step-list li.done .step-number{background:var(--olive-tint);border-color:var(--olive-tint);color:var(--olive-deep)}
.onboard-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 32px}
.onboard-panel h2{font-family:"Display",var(--sans);font-weight:900;font-size:24px}
.onboard-panel>p{margin-top:8px;font-size:13px;color:var(--muted)}
.option-list{border:0;padding:0;margin:22px 0 0;display:grid;gap:8px}
.option{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;min-height:62px;background:#fff}
.option:hover{background:var(--tint-2);border-color:#c9c5b6}
.option:has(input:checked){border-color:var(--purple);background:var(--purple-tint)}
.option input{accent-color:var(--purple);width:16px;height:16px;margin:0;flex-shrink:0}
.option strong{display:block;font-size:13px}
.option small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.onboard-actions{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:24px}
.onboard-actions .primary{margin-left:auto}
.onboard-summary{padding:14px 16px;background:var(--tint-2);font-size:12px;color:var(--muted);margin-top:18px;border-radius:2px;border-top:2px solid var(--olive)}
.onboard-summary strong{color:var(--ink)}
/* page title */
.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.page-title h1{font-size:32px}
.page-title p{font-size:13px;color:var(--muted);margin-top:5px}
/* home */
.learning-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.course-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);min-width:0}
.course-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.course-head-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.course-title{font:900 15px/1.4 "Display",var(--sans)}
.course-tools{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:#fff}
.seg button{font:700 10px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:7px 9px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.course-map{position:relative;background:#fff;overflow:hidden}
.course-map .map-shell{position:relative}
.course-map svg{display:block;width:100%;max-width:100%;height:auto}
.course-map .map-content{transform-origin:0 0;transition:transform .45s cubic-bezier(.16,1,.3,1)}
.course-map.is-leg .map-content{transform:translate(calc(430px - var(--fx,540) * 1.72px),calc(210px - var(--fy,280) * 1.72px)) scale(1.72)}
.map-legend{flex-basis:100%;display:flex;flex-wrap:wrap;gap:12px;padding:8px 0 0;border-top:1px solid var(--line);background:transparent;margin-top:4px;font:700 9px/1.5 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.map-legend span{display:inline-flex;align-items:center;gap:5px}
.map-legend i{width:12px;height:7px;border:1px solid var(--ink);border-radius:1px;display:inline-block}
.map-legend .contour{width:16px;height:2px;border:0;background:var(--brown)}
.map-legend .course-line{width:18px;height:3px;border:0;background:var(--purple);border-radius:2px}
.map-legend .course-line.thick{height:5px}
.map-legend .punch{width:9px;height:9px;border:0;border-radius:50%;background:var(--olive-deep)}
.north{position:absolute;right:12px;top:10px;display:flex;flex-direction:column;align-items:center;gap:1px;font:700 8px var(--cond);color:var(--muted);letter-spacing:.08em}
.north svg{width:16px;height:20px}
.scale{position:absolute;left:14px;bottom:10px;font:700 8px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.scale i{display:inline-block;width:42px;height:5px;border:1px solid var(--ink);border-top:0}
.map-control{cursor:pointer;outline:none}
.map-control .halo{fill:#fff;fill-opacity:.92}
.map-control .circle{fill:#fff;stroke:var(--purple);stroke-width:3.2;transition:stroke-width .14s ease,fill .14s ease}
.map-control .num{fill:var(--purple);font:700 12px var(--cond);pointer-events:none}
.map-control.is-done .circle{fill:var(--olive-deep);stroke:var(--olive-deep)}
.map-control.is-done .num{fill:#fff}
.map-control.is-current .circle{stroke-width:4.5}
.map-control .ring{fill:none;stroke:var(--purple);stroke-width:1.6;opacity:.55}
.map-control .target-ring{fill:none;stroke:var(--purple);stroke-width:1.8;opacity:.5}
.map-control.is-linked .circle,.map-control:focus-visible .circle{stroke-width:6;fill:var(--purple-tint)}
.map-control.is-done.is-linked .circle{fill:var(--olive-deep);stroke:var(--olive-deep)}
.map-label{font:700 9.5px var(--cond);fill:#3c403d;letter-spacing:.02em;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.map-label.dim{fill:#6b6f64}
.map-now{font:700 8.5px var(--cond);fill:#fff;letter-spacing:.06em;pointer-events:none}
.map-now-bg{fill:var(--purple)}
.terrain-label{fill:#3c403d;font:700 9px var(--cond);letter-spacing:.1em;text-transform:uppercase;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.feature{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:18px}
.feature-body{padding:22px 24px 20px}
.feature-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:9px}
.feature h2{font-family:"Display",var(--sans);font-weight:900;font-size:27px;margin-top:0;max-width:640px}
.feature-description{color:var(--muted);font-size:13.5px;line-height:1.85;margin-top:12px;max-width:68ch}
.feature-preview{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:22px;padding-top:15px;border-top:1px solid var(--line)}
.feature-preview h3{font:700 9.5px/1.4 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.feature-preview p{font-size:12px;color:var(--ink-2);line-height:1.7}
.feature-reason{margin-top:16px;font-size:11.5px;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
.feature-bottom{padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:18px;background:var(--tint-2);border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.feature-bottom .primary{white-space:nowrap}
.task-list{border-top:2px solid var(--ink)}
.task-row{display:grid;grid-template-columns:30px minmax(0,1fr) 62px;gap:12px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}
.task-row .order{font:800 15px/1 var(--cond);color:var(--muted-2)}
.task-row strong{font-weight:700;font-size:13.5px}
.task-row p{font-size:11.5px;color:var(--muted);margin-top:2px}
.task-row .time{font:700 11px var(--cond);color:var(--muted);text-align:right}
.task-row:hover{background:var(--tint-2)}
.task-row:hover strong{text-decoration:underline;text-underline-offset:3px}
.learning-aside{font-size:12px}
.aside-section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px}
.aside-section+.aside-section{margin-top:14px}
.aside-section h2{font-size:13px;margin-bottom:11px}
.aside-section p{color:var(--muted);line-height:1.8}
.profile-facts{margin:0;display:grid;gap:11px}
.profile-facts dt{font:700 9.5px/1.4 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.profile-facts dd{margin:0;font-size:12px}
.profile-facts+.link-button{margin-top:14px}
.flow-list{padding:0;margin:0;list-style:none;display:grid;gap:12px}
.flow-list li{display:grid;grid-template-columns:20px 1fr;gap:8px;color:var(--muted);font-size:11.5px}
.flow-list i{font-style:normal;font:800 10px var(--cond);color:var(--purple);padding-top:1px}
.flow-list strong{display:block;color:var(--ink);font-weight:700;font-size:11.5px}
.flow-list small{font-size:10.5px}
/* course table */
.course-table{width:100%;border-collapse:collapse;font-size:11.5px}
.course-table th{font:700 9px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--ink);padding:0 0 6px}
.course-table th:first-child{width:20px}
.course-table th:last-child{text-align:right;width:44px}
.course-table td{padding:8px 0;border-bottom:1px solid var(--line-2);vertical-align:top}
.course-table td:first-child{font:800 12px/1.5 var(--cond);color:var(--purple)}
.course-table td:last-child{text-align:right}
.course-table .cname{display:block;font-weight:700;font-size:11.5px;line-height:1.45}
.course-table small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.course-table tr.is-current td{background:var(--purple-tint)}
.course-table tr.is-linked td{background:var(--purple-tint)}
.cstatus{display:inline-block;font:700 9px/1.4 var(--cond);letter-spacing:.04em;text-transform:uppercase;padding:2px 5px;border-radius:2px;background:var(--tint);color:var(--muted)}
.cstatus.done{background:var(--olive-tint);color:var(--olive-deep)}
.cstatus.current{background:var(--purple);color:#fff}
.cstatus.next{background:var(--tint-2);color:var(--muted)}
/* mini map */
.mini-map{background:#fff;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.mini-map svg{display:block;width:100%;height:auto}
/* task */
.back{display:inline-flex;margin-bottom:14px}
.task-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;align-items:start}
.task-document{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px 28px}
.task-kicker{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.task-document h1{font-size:28px;margin:0}
.task-document>p{color:var(--muted);font-size:13.5px;line-height:1.9;margin-top:14px;max-width:70ch}
.task-document .mini-map{margin:16px 0 4px;max-width:340px}
.document-section{margin-top:24px}
.document-section h2{font-size:16px;margin-bottom:9px}
.requirements{padding-left:18px;margin:0;display:grid;gap:7px;font-size:13px;line-height:1.85}
.code-panel{background:#20241e;border:1px solid #2f352c;border-radius:2px;overflow:hidden;margin-top:12px;color:#e7ebdf}
.code-file{padding:7px 14px;color:#a9b19c;font-size:10.5px;border-bottom:1px solid #343a30;font-family:var(--mono)}
.code-panel pre{color:#e7ebdf}
.task-submission{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.task-submission h2{font-size:16px}
.task-submission>p{font-size:12px;color:var(--muted);margin-top:8px}
.field-label{display:block;font-size:12px;font-weight:700;margin:18px 0 7px}
.branch{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--purple-tint);border-radius:2px;padding:7px 9px}
.branch code{background:none;padding:0;font-size:11px;color:var(--purple-deep)}
.copy{min-height:32px;min-width:30px;padding:4px;color:var(--purple)}
.url-input{display:block;width:100%;padding:11px 10px;border:1px solid #b8b4a4;border-radius:2px;background:#fff;font-size:12px;min-width:0}
.url-input::placeholder,textarea::placeholder{color:#7a7e73;opacity:1}
.task-submission .primary{width:100%;margin-top:14px}
.task-submission .status{font-size:12px;color:var(--olive-deep);margin-top:10px}
.task-submission .status:empty{display:none}
.task-side-note{font-size:11.5px;color:var(--muted);padding:14px 2px;line-height:1.8}
/* assessment */
.assessment-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px}
.assessment-heading h1{font-size:26px}
.stage{display:flex;gap:7px;align-items:center;font:700 10px/1.4 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.stage .punch{width:8px;height:8px;border-radius:50%;background:var(--purple);display:inline-block;flex:none}
.assessment-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px;align-items:start}
.chat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;border-bottom:1px solid var(--line);font-size:12px}
.chat-header strong{font-size:13px}
.chat-header small{font:700 9.5px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chat-log{display:grid;gap:20px;padding:20px;max-height:430px;min-height:220px;overflow:auto;scrollbar-gutter:stable}
.message-author{font:700 9.5px/1.4 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.message-text{font-size:13.5px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}
.message.user{padding:13px 15px;background:var(--purple-tint);border:1px solid #e3d0ec;border-radius:2px}
.chat-form{padding:16px 20px;border-top:1px solid var(--line)}
.chat-form label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}
.chat-form textarea{display:block;width:100%;min-height:104px;max-height:260px;resize:vertical;padding:11px 12px;background:#fff;border:1px solid #b8b4a4;border-radius:2px;font-size:13px;line-height:1.8;caret-color:var(--purple)}
.chat-actions{display:flex;justify-content:space-between;gap:14px;margin-top:10px;align-items:center}
.chat-actions .primary{margin-left:auto}
.chat-actions .link-button{font-size:11px;text-align:left}
.source{background:var(--tint-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.source>summary{cursor:pointer;padding:12px 15px;font-size:12px;font-weight:700;list-style-position:inside}
.source-inner{padding:0 15px 15px}
.source-meta{font-size:10.5px;color:var(--muted);display:grid;gap:4px;padding:8px 0}
.source-meta code{background:none;padding:0;font-size:10.5px}
.source .code-panel{margin-top:0;border:0;border-top:1px solid #343a30}
.source pre{max-height:380px;font-size:11px;padding:12px 12px 12px 0}
.source .code-file{padding-left:0}
.source[open]>summary{border-bottom:1px solid var(--line)}
.assessment-note{padding:16px 2px;font-size:11.5px;color:var(--muted)}
.assessment-note h2{font:700 11px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:7px}
.assessment-note ul{padding-left:17px;line-height:1.85;font-size:11.5px}
.chat-pending{padding:0 20px 14px;font-size:11.5px;color:var(--purple-deep)}
/* history */
.history-grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:26px;align-items:start}
.activity{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;overflow:auto}
.activity-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:13px}
.activity-head h2{font-size:15px}
.activity-head span{font:700 9.5px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.heatmap{display:grid;grid-template-rows:repeat(7,11px);grid-template-columns:repeat(26,11px);grid-auto-flow:column;gap:3px;width:fit-content}
.heat-cell{background:var(--tint-2);border:1px solid var(--line-2);border-radius:1px}
.heat-cell[data-level="1"]{background:#c9d2b5;border-color:#c9d2b5}
.heat-cell[data-level="2"]{background:#8fa06b;border-color:#8fa06b}
.heat-cell[data-level="3"]{background:#4e5f38;border-color:#4e5f38}
.heat-cell.future{visibility:hidden}
.heat-labels{display:flex;justify-content:space-between;max-width:412px;margin-top:9px;font-size:10px;color:var(--muted)}
.history-list{border-top:2px solid var(--ink);margin-top:12px}
.history-row{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) 62px 46px;align-items:center;gap:12px;padding:14px 0;text-align:left;border-bottom:1px solid var(--line)}
.history-row .order{font:800 14px var(--cond);color:var(--muted-2)}
.history-row strong{font-weight:700;font-size:12.5px}
.history-row:hover{background:var(--tint-2)}
.history-row:hover strong{text-decoration:underline;text-underline-offset:3px}
.history-row small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.history-row time{font-size:10.5px;color:var(--muted)}
.outcome{font:800 10px var(--cond);letter-spacing:.06em;color:var(--olive-deep);text-align:right}
.outcome.fail{color:var(--red)}
.empty{padding:22px 0;font-size:13px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:16px;margin-bottom:6px}
.empty p{margin-top:6px}
.filter-bar{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:11px;margin:14px 0}
.filter-bar label{font-size:10.5px;color:var(--muted);display:block;margin-bottom:4px;font-weight:700}
.filter-bar input,.filter-bar select{width:100%;background:#fff;border:1px solid #b8b4a4;border-radius:2px;padding:9px 10px;font-size:12px;min-height:40px}
.filter-result{font-size:10.5px;color:var(--muted);margin-bottom:8px}
/* result */
.result-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:26px}
.result-document{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px 28px}
.result-status{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.result-status strong{font:900 24px/1 "Display",var(--cond);letter-spacing:.04em;color:var(--olive-deep)}
.result-status.fail strong{color:var(--red)}
.result-status span{font:700 9.5px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.result-document h1{font-size:26px}
.feedback-section{margin-top:22px}
.feedback-section h2{font:700 11px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.feedback-section p{font-size:13px;color:var(--ink-2);line-height:1.95;max-width:70ch}
.result-summary{font-size:13.5px;margin-top:10px;color:var(--muted)}
.result-actions{display:flex;align-items:center;gap:18px;border-top:1px solid var(--line);margin-top:24px;padding-top:18px;flex-wrap:wrap}
.transcript{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.transcript summary{font-size:12px;cursor:pointer;list-style-position:inside;font-weight:700}
.transcript .chat-log{padding:16px 0 0;max-height:430px;min-height:0}
.result-side h2{font-size:13px;margin:20px 0 9px}
.result-side p{font-size:11.5px;color:var(--muted)}
.result-side .mini-map{margin-bottom:8px}
.read-task summary{font-size:12px;cursor:pointer;list-style-position:inside;margin:14px 0;font-weight:700}
.read-task p,.read-task li{font-size:11.5px;color:var(--muted);line-height:1.8}
.read-task ul{padding-left:17px}
/* auth */
.auth-layout{max-width:980px;margin:10px auto;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:56px;align-items:start}
.auth-info{padding-top:12px}
.auth-info h1{font-size:32px}
.auth-info>p{margin-top:14px;color:var(--muted);font-size:13.5px;max-width:44ch}
.auth-info .flow-list{margin-top:26px}
.auth-info .mini-map{margin-top:20px}

<script>

const choices={
 purpose:[['explore','관심 분야를 탐색하고 싶어요','무엇을 배울지 아직 정하지 않았어요.'],['basics','기초를 제대로 이해하고 싶어요','CS 개념과 코드의 동작 원리를 연결하고 싶어요.'],['career','취업·직무 전환을 준비해요','목표 직무에 필요한 지식을 쌓고 싶어요.'],['work','실무에서 부족한 부분을 채워요','프로젝트에서 만난 문제를 더 깊이 이해하고 싶어요.'],['school','학교에서 배운 내용을 적용해요','이론을 작은 프로젝트로 확인하고 싶어요.']],
 goal:[['undecided','아직 탐색 중이에요','분야를 정하기 전에 여러 개념을 접하고 싶어요.'],['cs','컴퓨터 과학 기초','실행 흐름, 자료구조, 운영체제와 네트워크'],['backend','백엔드 개발','서버, 데이터 처리와 동시성'],['frontend','프론트엔드 개발','브라우저, 사용자 인터랙션과 웹'],['reliability','서비스 운영·안정성','네트워크, 오류 처리와 안정적인 실행']],
 experience:[['beginner','이제 시작해요','코드를 많이 작성해 보지 않았어요.'],['basic','기초 코드는 읽고 쓸 수 있어요','함수, 조건문, 반복문을 사용해 봤어요.'],['experienced','프로젝트를 만들어 봤어요','동작하는 코드를 넘어 원리를 이해하고 싶어요.']]
};
const tasks={
 stack:{title:'함수 호출을 스택으로 따라가기',concept:'콜 스택',area:'CS 기초',minutes:25,language:'코드 작성 없이',branch:'smallbyte/call-stack',file:'README.md',description:'함수가 다른 함수를 호출할 때, 무엇이 먼저 끝날까요? 호출 스택을 그리며 실행 순서를 확인합니다.',problem:'greet()는 getName()을 호출하고, 결과를 받아 인사말을 반환합니다. 아래 코드의 각 함수가 호출되고 반환될 때 스택에 무엇이 남아 있는지 기록하세요.',requirements:['함수 호출과 반환 단계마다 스택에 남는 함수를 순서대로 기록하세요.','greet()가 getName()의 결과를 기다리는 동안 어디에 있는지 설명하세요.','출력 결과를 먼저 예상하고, 실행 결과와 비교해 README.md에 적으세요.'],starter:'function getName() {\n  return "smallbyte";\n}\n\nfunction greet() {\n  const name = getName();\n  return "Hello, " + name;\n}\n\nconsole.log(greet());',sample:'greet 호출 → getName 호출\ngetName 반환 → greet 반환\nconsole.log 호출\n\n출력: Hello, smallbyte',prompts:['getName()이 실행되는 동안 greet()는 어디에 있나요? 작성한 스택 기록을 따라 설명해 주세요.','getName()이 끝나면 왜 greet()로 돌아가나요? 스택에서 제거되는 것과 남는 것을 구분해 주세요.','함수가 자기 자신을 계속 호출하고 반환하지 않으면 어떤 일이 생길까요?'],good:'함수의 호출과 반환 순서를 스택으로 기록했습니다. 가장 나중에 호출된 함수가 먼저 반환된다는 원리도 설명했습니다.',improve:'실행이 잠시 멈춘 상태와 스택에서 제거된 상태를 구분해 보세요. getName()이 실행되는 동안 greet()의 실행 맥락은 스택에 남아 있습니다.',retry:'getName() 실행 직전과 반환 직후의 스택을 각각 그리고, greet()가 언제 사라지는지 표시해 보세요.',next:'이벤트 루프를 살펴보세요. 비동기 콜백이 언제 콜 스택에 올라오는지 비교하면 동기·비동기 실행을 연결할 수 있습니다.'},
 http:{title:'HTTP 응답 하나를 읽어 보기',concept:'HTTP',area:'네트워크',minutes:40,language:'코드 작성 없이',branch:'smallbyte/http-response',file:'README.md',description:'브라우저가 받은 응답 하나에서 상태 코드, 헤더, 본문의 역할을 구분합니다.',problem:'브라우저 개발자 도구의 Network 탭에서 공개 웹 페이지의 요청 하나를 선택하세요. 응답을 살펴보고 각 구성 요소의 역할을 README.md에 설명합니다.',requirements:['요청 URL과 메서드, 응답 상태 코드를 기록하세요.','응답 헤더 두 개를 골라 의미를 설명하세요.','응답 본문과 헤더의 차이, 200과 404의 차이를 설명하세요.'],starter:'HTTP/1.1 200 OK\nContent-Type: text/html; charset=utf-8\nCache-Control: max-age=60\n\n<html>Hello, smallbyte</html>',sample:'상태 코드: 200 — 요청 처리 성공\nContent-Type: 본문의 형식\nCache-Control: 캐시 정책\n\n본문: 실제 전달할 콘텐츠',prompts:['선택한 응답에서 상태 코드와 본문은 각각 무슨 역할을 하나요?','Content-Type이 text/html 대신 application/json이라면 무엇을 알 수 있나요?','404 응답에도 본문이 있을 수 있나요? 그 이유를 설명해 주세요.'],good:'상태 코드, 헤더, 본문을 구분했습니다. 실제 요청에서 찾은 헤더의 의미도 기록했습니다.',improve:'요청 처리 결과와 본문의 형식은 서로 다른 정보입니다. 상태 코드와 Content-Type이 알려 주는 내용을 비교해 보세요.',retry:'200과 404 응답을 나란히 놓고 각각 상태 코드, 헤더, 본문을 표시한 뒤 차이를 설명해 보세요.',next:'브라우저 캐시를 살펴보세요. 같은 요청을 다시 보냈을 때 네트워크 응답이 어떻게 달라지는지 확인할 수 있습니다.'},
 dom:{title:'클릭으로 목록에 항목 추가하기',concept:'DOM과 이벤트',area:'웹 개발',minutes:45,language:'JavaScript',branch:'smallbyte/dom-events',file:'index.html',description:'버튼 클릭부터 화면의 변화까지. DOM 요소를 직접 만들고 목록에 추가합니다.',problem:'입력한 할 일을 목록에 추가하는 페이지를 만드세요. 프레임워크 없이 클릭 이벤트를 연결하고, 새 요소를 만든 뒤 입력창을 비웁니다.',requirements:['입력창, 추가 버튼, 목록을 HTML로 만드세요.','클릭하면 새 li 요소에 입력한 텍스트를 넣고 목록에 추가하세요.','빈 입력은 추가하지 않고 사용자 입력을 HTML이 아닌 텍스트로 표시하세요.'],starter:'const input = document.querySelector("#task");\nconst list = document.querySelector("#list");\nconst button = document.querySelector("#add");\n\nbutton.addEventListener("click", () => {\n  // 새 요소를 만들고 추가해 보세요.\n});',sample:'const item = document.createElement("li");\nitem.textContent = input.value;\nlist.append(item);\ninput.value = "";',prompts:['버튼 클릭 전과 후에 DOM에서 바뀌는 부분은 무엇인가요? 작성한 코드 순서로 설명해 주세요.','입력값이 <b>안녕</b>이라면 어떻게 보이나요? textContent와 innerHTML을 비교해 주세요.','클릭할 때마다 이벤트 핸들러를 다시 등록하면 어떤 문제가 생길까요?'],good:'이벤트 처리와 DOM 변경의 관계를 설명했습니다. 요소를 만들고 목록에 추가하는 흐름도 코드로 확인했습니다.',improve:'사용자 입력을 HTML로 해석하는 경우와 텍스트로 표시하는 경우를 구분해 보세요. textContent를 선택한 이유가 중요합니다.',retry:'<b>안녕</b>을 입력하고 실제 표시 결과를 확인하세요. textContent를 사용한 이유를 README에 정리해 보세요.',next:'이벤트 버블링과 이벤트 위임으로 이어가 보세요. 여러 목록 항목을 하나의 핸들러로 처리하는 방법을 배울 수 있습니다.'},
 semaphore:{title:'세마포어로 요청 제어하기',concept:'세마포어',area:'CS · 동시성',minutes:60,language:'JavaScript',branch:'smallbyte/semaphore',file:'src/semaphore.js',description:'동시에 실행되는 요청은 3개만. 대기 중인 요청에 실행 자리를 넘기는 작은 세마포어를 만듭니다.',problem:'이미지 변환 작업 10개를 처리하려고 합니다. API는 한 번에 3개까지만 처리할 수 있습니다. 자리가 생기면 다음 요청을 실행하도록 세마포어를 구현하세요.',requirements:['허용 개수를 받는 Semaphore와 acquire(), release()를 구현하세요.','작업 10개를 실행해 동시 실행 수가 3을 넘지 않는지 확인하세요.','작업이 실패해도 자리를 반환하고 대기 중인 작업이 실행되는지 테스트하세요.'],starter:'const semaphore = new Semaphore(3);\n\nasync function runTask(task) {\n  await semaphore.acquire();\n  try {\n    return await task();\n  } finally {\n    semaphore.release();\n  }\n}',sample:'async acquire() {\n  if (this.active < this.limit) {\n    this.active++;\n    return;\n  }\n  await new Promise(resolve => {\n    this.queue.push(resolve);\n  });\n}\n\nrelease() {\n  const next = this.queue.shift();\n  if (next) next();\n  else this.active--;\n}',prompts:['이미 3개의 요청이 실행 중일 때 acquire()를 호출하면 네 번째 요청은 어떻게 되나요? 작성한 코드 흐름을 따라 설명해 주세요.','대기 요청을 깨울 때 active 값은 어떻게 관리하나요? 그 사이 새 요청이 들어오면 무슨 일이 일어날까요?','작업 실패 시 release()를 호출하지 않으면 나머지 요청은 어떻게 되나요? finally를 사용한 이유를 설명해 주세요.','허용 개수가 1인 세마포어와 뮤텍스의 공통점과 차이는 무엇일까요?'],good:'동시 실행 수를 제한하는 원리와 대기열의 역할을 설명했습니다. 오류가 나도 finally에서 자리를 반환하도록 구현한 점도 좋습니다.',improve:'대기 요청을 깨울 때 자리가 누구에게 전달되는지 살펴보세요. 새 요청이 먼저 실행되는 상황까지 테스트하면 더 견고해집니다.',retry:'허용 개수 1, 대기 요청 2개인 상황에서 active 값과 queue를 단계별로 적고 자리가 중복 할당되지 않는지 확인하세요.',next:'뮤텍스를 살펴보세요. 동시 실행 수 제한과 공유 자원에 대한 소유권을 비교하면 두 개념의 차이를 이해할 수 있습니다.'}
};

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s||s.version!==2||typeof s.signedIn!=='boolean'||typeof s.onboardingComplete!=='boolean'||!s.profile||!Object.keys(choices).every(k=>s.profile[k]===''||choices[k].some(c=>c[0]===s.profile[k]))||(s.onboardingComplete&&!validProfile(s.profile))||!Number.isInteger(s.onboardingStep)||s.onboardingStep<0||s.onboardingStep>2||(s.active!==null&&!validAttempt(s.active))||typeof s.repo!=='string'||!Array.isArray(s.history)||!s.history.every(r=>validAttempt(r)&&typeof r.id==='string'&&['pass','fail'].includes(r.outcome)&&typeof r.date==='string'&&!Number.isNaN(Date.parse(r.date)))||!Array.isArray(s.activity)||!s.activity.every(d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)))return blank();return s}catch{return blank()}}

function mapArt(opts={}){
 const {mini=false,target=null}=opts,order=ranked(),passed=passedSet(),focus=target||focusTask();
 const focusIndex=focus?order.indexOf(focus):-1,pts=[[70,360],[150,320],[340,250],[540,280],[700,140],[790,80]];
 let segs='';
 for(let i=0;i<pts.length-1;i++){const [ax,ay]=pts[i],[bx,by]=pts[i+1];if(i===focusIndex)segs+=`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#fff" stroke-width="12" stroke-linecap="round"/><line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#7b2f9e" stroke-width="7" stroke-linecap="round"/>`;else segs+=`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#7b2f9e" stroke-width="4" stroke-linecap="round" opacity=".9"/>`}
 const controls=order.map((id,i)=>{const st=controlStatus(id),[x,y]=pts[i+1],isTarget=target===id;const aria=mini?'':`data-control="${id}" role="button" tabindex="0" aria-label="컨트롤 ${i+1}, ${esc(tasks[id].title)}, ${st==='done'?'완료':st==='current'?'진행 중':'예정'}"`;const num=mini?'':`<text class="num" x="${x}" y="${y+4}" text-anchor="middle">${i+1}</text>`;const label=mini?'':`<text class="map-label${st==='next'?' dim':''}" x="${x}" y="${y-27}" text-anchor="middle">${esc(tasks[id].concept)}</text>`;const ring=st==='current'&&!mini?`<circle class="ring" cx="${x}" cy="${y}" r="27"/>`:'';const targetRing=isTarget?`<circle class="target-ring" cx="${x}" cy="${y}" r="${mini?18:25}"/>`:'';const now=st==='current'&&!mini?`<rect class="map-now-bg" x="${x-17}" y="${y+22}" width="34" height="14" rx="2"/><text class="map-now" x="${x}" y="${y+32}" text-anchor="middle">지금</text>`:'';return `<g class="map-control is-${st}${isTarget?' is-target':''}" ${aria}>${targetRing}${ring}<circle class="halo" cx="${x}" cy="${y}" r="${mini?13:19}"/><circle class="circle" cx="${x}" cy="${y}" r="${mini?7:15}" ${mini?'stroke-width="2.4"':''}/>${num}${label}${now}</g>`}).join('');
 const doneCount=order.filter(id=>passed.has(id)).length,a11y=mini?'aria-hidden="true"':`role="img" aria-label="학습 코스 지도. ${order.map((id,i)=>`${i+1}번 ${tasks[id].title}`).join(', ')}. ${doneCount}개 컨트롤을 완료했습니다."`;
 return `<svg viewBox="0 0 860 420" ${a11y}><rect width="860" height="420" fill="#fff"/><g class="map-content">${mapTerrain()}${segs}<path d="M70 346 L86 372 L54 372 Z" fill="#7b2f9e"/><circle cx="790" cy="80" r="15" fill="#fff" stroke="#7b2f9e" stroke-width="4"/><circle cx="790" cy="80" r="8" fill="none" stroke="#7b2f9e" stroke-width="3"/>${controls}</g></svg>`}
function courseMap(){const order=ranked(),f=focusTask(),idx=f?order.indexOf(f):-1,pos=[[150,320],[340,250],[540,280],[700,140]][Math.max(0,idx)]||[540,280];return `<div class="course-map${mapFocus==='leg'?' is-leg':''}" style="--fx:${pos[0]};--fy:${pos[1]}"><div class="map-shell">${mapArt()}<div class="north" aria-hidden="true"><span>N</span><svg viewBox="0 0 18 22"><path d="M9 2 L14 20 L9 16 L4 20 Z" fill="#1b1d19"/></svg></div><div class="scale" aria-hidden="true"><i></i><span>1칸 ≈ 1 과제</span></div></div></div>`}
function miniMap(id){return `<div class="mini-map">${mapArt({mini:true,target:id})}</div>`}
function controlTable(){const order=ranked();return `<table class="course-table" aria-label="컨트롤 설명표"><thead><tr><th>#</th><th>컨트롤</th><th>상태</th></tr></thead><tbody>${order.map((id,i)=>{const st=controlStatus(id);return `<tr data-control="${id}" class="${st==='current'?'is-current':''}"><td>${i+1}</td><td><span class="cname">${esc(tasks[id].title)}</span><small>${esc(tasks[id].concept)} · ${tasks[id].minutes}분</small></td><td><span class="cstatus ${st}">${st==='done'?'완료':st==='current'?'진행':'예정'}</span></td></tr>`}).join('')}</tbody></table>`}
function courseProgress(){const total=Object.keys(tasks).length,done=passedSet().size;return `<div class="course-progress"><div class="bar"><i style="width:${Math.round(done/total*100)}%"></i></div><p>${done} / ${total} 컨트롤 완료</p></div>`}
function recordRow(r){return `<button class="history-row" data-record="${esc(r.id)}"><span class="order">${taskNumber(r.taskId)}</span><span><strong>${esc(tasks[r.taskId].title)}</strong><small>${esc(tasks[r.taskId].concept)} · 대화와 피드백</small></span><time datetime="${esc(r.date)}">${shortDate(r.date)}</time><span class="outcome ${r.outcome==='fail'?'fail':''}">${r.outcome.toUpperCase()}</span></button>`}
function landingView(){return loginView()}
function loginView(){const demo='semaphore',t=tasks[demo];return `<div class="entry"><section class="entry-copy"><h1>개념을 지형으로,<br><em>배움을 코스로.</em></h1><p>CS와 개발 개념을 작은 과제로 익힙니다. 나에게 맞는 코스를 따라가고, 코드에 대한 대화로 이해를 확인하세요.</p><button class="primary" data-action="login">${icon('github')} GitHub로 시작하기</button><p class="notice">첫 로그인 후, 학습 목적과 경험을 설정합니다.</p><div class="entry-process"><span><strong>나에게 맞는 코스</strong>정해진 순서 없이</span><span><strong>하루 이하의 과제</strong>마감 없이 내 속도로</span><span><strong>코드에 대한 대화</strong>이해와 성장 중심으로</span></div></section><section class="entry-example" aria-label="학습 코스 예시"><div class="example-head"><span>예시 코스 · 4개 컨트롤</span><span>${t.minutes}분</span></div><div class="example-map">${mapArt({target:demo})}</div><div class="example-body"><span class="tag">${esc(t.area)}</span><h2>${esc(t.title)}</h2><p>${esc(t.description)}</p><div class="example-code"><pre>${esc(t.starter.split('\n').slice(0,7).join('\n'))}</pre></div></div><div class="example-bottom">완성한 코드에서 시작하는 질문 · “네 번째 요청은 어떻게 되나요?”</div></section></div>`}
function onboardingView(){const p=editing?editDraft:state.profile,s=editing?editStep:state.onboardingStep,key=['purpose','goal','experience'][s];const titles=['무엇을 위해 배우고 있나요?','어떤 분야가 궁금한가요?','어느 정도 경험이 있나요?'];return `<div class="onboarding"><aside class="onboard-aside"><h1>${editing?'학습 방향 바꾸기':'나에게 맞는 코스를 만듭니다.'}</h1><p>${editing?'변경한 정보는 다음 코스 추천에 반영합니다.':'GitHub 연결을 마쳤습니다. 세 가지만 알려주시면 첫 코스를 추천합니다.'}</p><ol class="step-list">${['학습 목적','관심 분야','현재 경험'].map((t,i)=>`<li class="${i===s?'current':i<s?'done':''}" ${i===s?'aria-current="step"':''}><span class="step-number">${i+1}</span><span>${t}</span></li>`).join('')}</ol></aside><form class="onboard-panel" id="onboarding-form"><h2>${titles[s]}</h2><p>${['지금 배우려는 이유에 가장 가까운 것을 골라 주세요.','직무가 정해지지 않았다면 탐색 중을 선택해도 됩니다.','잘하는지 평가하는 질문이 아닙니다. 시작할 과제를 고르는 데만 사용합니다.'][s]}</p><fieldset class="option-list" aria-label="${titles[s]}">${choices[key].map(([value,title,desc])=>`<label class="option"><input type="radio" name="${key}" value="${value}" ${p[key]===value?'checked':''} required><span><strong>${title}</strong><small>${desc}</small></span></label>`).join('')}</fieldset>${s===2?`<div class="onboard-summary"><strong>지금까지 선택한 내용</strong><br>${esc(label('purpose',p.purpose))}<br>${esc(label('goal',p.goal))}</div>`:''}<div class="onboard-actions">${s>0?'<button class="link-button" type="button" data-action="onboard-back">이전</button>':editing?'<button class="link-button" type="button" data-action="cancel-edit">취소</button>':''}<button class="primary" type="submit">${s===2?editing?'변경 내용 저장':'첫 코스 시작하기':'다음'}</button></div></form></div>`}
function homeView(){const active=state.active,passed=passedSet(),order=ranked(),focus=focusTask(),id=focus||order[0],t=tasks[id],num=order.indexOf(id)+1;const tag=active?'진행 중':passed.has(id)?'다시 학습':'추천 컨트롤';const footer=active?(active.stage==='chat'?'작업물을 연결했습니다. 대화를 이어갈 수 있습니다.':'과제 안내를 확인했습니다. 작업 후 제출해 주세요.'):'미리 준비된 과제 · 제출 마감 없음';return `<header class="page-title"><div><h1>나의 학습</h1><p>${active?'진행하던 과제를 이어서 학습하세요.':'관심 분야와 경험을 바탕으로 고른 코스입니다.'}</p></div><span class="small muted">${new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric'}).format(new Date())}</span></header><div class="learning-grid"><div><section class="course-card"><div class="course-head"><div class="course-head-left"><h2 class="course-title">학습 코스</h2><span class="course-sub">${order.length}개 컨트롤 · ${esc(label('goal',state.profile.goal))}</span></div><div class="course-tools"><div class="seg" role="group" aria-label="지도 보기"><button type="button" data-map-focus="course" aria-pressed="${mapFocus==='course'}">전체 코스</button><button type="button" data-map-focus="leg" aria-pressed="${mapFocus==='leg'}">현재 구간</button></div></div><div class="map-legend"><span><i style="background:#b5c48a"></i><i style="background:#f5e27a"></i><i style="background:#7aa7d8"></i>지형 = 개념 영역</span><span><i class="contour"></i>등고선 = 경계</span><span><i class="course-line"></i>보라 = 코스</span><span><i class="course-line thick"></i>굵은 선 = 지금 구간</span><span><i class="punch"></i>올리브 원 = 완료</span></div></div>${courseMap()}</section><article class="feature"><div class="feature-body"><div class="feature-head"><h2>${esc(t.title)}</h2><span class="tag ${passed.has(id)&&!active?'olive':''}">컨트롤 ${num} · ${tag}</span></div><div style="margin-top:9px">${meta(t)}</div><p class="feature-description">${esc(t.description)}</p><div class="feature-preview"><div><h3>직접 해 볼 일</h3><p>${esc(t.requirements[0])}</p></div><div><h3>학습 후 설명할 수 있는 것</h3><p>${esc(t.prompts[0].split('?')[0])}</p></div></div><p class="feature-reason">${esc(reason(id))}</p></div><div class="feature-bottom"><span>${footer}</span><button class="primary" ${active?'data-action="resume"':`data-start="${id}"`}>${active?(active.stage==='chat'?'대화 이어하기':'과제 이어하기'):'과제 시작하기'}</button></div></article><div class="section-head"><h2>다른 컨트롤</h2><span>관심과 경험을 반영한 순서</span></div><div class="task-list">${order.filter(k=>k!==id).map(k=>`<button class="task-row" data-start="${k}"><span class="order">${order.indexOf(k)+1}</span><span><strong>${esc(tasks[k].title)}</strong><p>${esc(tasks[k].concept)} · ${esc(tasks[k].language)}${passed.has(k)?' · 완료':''}</p></span><span class="time">${tasks[k].minutes}분</span></button>`).join('')}</div>${active?'<p class="notice">다른 과제는 현재 과제를 마친 뒤 시작할 수 있습니다.</p>':''}</div><aside class="learning-aside"><section class="aside-section"><h2>컨트롤 설명표</h2>${controlTable()}</section><section class="aside-section"><h2>나의 학습 방향</h2><dl class="profile-facts"><div><dt>학습 목적</dt><dd>${esc(label('purpose',state.profile.purpose))}</dd></div><div><dt>관심 분야</dt><dd>${esc(label('goal',state.profile.goal))}</dd></div><div><dt>현재 경험</dt><dd>${esc(label('experience',state.profile.experience))}</dd></div></dl><button class="link-button" data-action="edit-profile">학습 방향 수정</button></section><section class="aside-section"><h2>하나의 과제를 마치는 과정</h2>${steps()}</section></aside></div>`}
function taskView(){const a=state.active,t=tasks[a.taskId],n=taskNumber(a.taskId);return `<button class="link-button back" data-go="home">학습으로 돌아가기</button><div class="task-layout"><article class="task-document"><h1>${esc(t.title)}</h1><div class="task-kicker"><span class="tag olive">컨트롤 ${n}</span><span class="meta"><span>${esc(t.area)}</span><span>${esc(t.language)}</span><span>예상 ${t.minutes}분</span></span></div>${miniMap(a.taskId)}<p>${esc(t.problem)}</p><section class="document-section"><h2>완료 조건</h2><ul class="requirements">${t.requirements.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></section><section class="document-section"><h2>${t.language==='코드 작성 없이'?'살펴볼 예시':'시작 코드'}</h2><p class="small muted">${t.language==='코드 작성 없이'?'예시를 참고해 자신의 설명을 작성하세요.':'아래 사용 예시가 동작하도록 구현하세요. 구현 방식은 자유입니다.'}</p><div class="code-panel"><div class="code-file">${esc(t.file)} · 과제 예시</div><pre><code>${esc(t.starter)}</code></pre></div></section><section class="document-section"><h2>제출 후에는</h2><p class="small muted">작업물에 대한 질문에 답하며 개념을 확인합니다. 정답만 맞히기보다, 왜 그렇게 동작하는지 자신의 언어로 설명해 주세요.</p></section></article><aside><form class="task-submission" id="submit-form" novalidate><h2>작업물 연결</h2><p>아래 브랜치에서 작업한 뒤 저장소 주소를 제출하세요.</p><span class="field-label">이 과제의 지정 브랜치</span><div class="branch"><code>${esc(t.branch)}</code><button class="copy" type="button" data-action="copy" aria-label="브랜치명 복사">${icon('copy')}</button></div><label class="field-label" for="repo">GitHub 저장소 URL</label><input class="url-input" id="repo" type="url" autocomplete="url" value="${esc(a.repo)}" placeholder="https://github.com/name/cs-lab" aria-describedby="repo-error repo-help" required ${connecting?'disabled':''}><p class="error" id="repo-error" role="alert"></p><p class="notice" id="repo-help">이 브랜치에 작업물을 push하세요. ${t.language==='코드 작성 없이'?'GitHub에서 README.md를 직접 작성해도 됩니다.':'파일이나 경로를 따로 지정할 필요는 없습니다.'}</p><button class="primary" type="submit" ${connecting?'disabled':''}>${connecting?'작업물 확인 중…':'제출하고 대화하기'}</button><p class="status" role="status">${connecting?'예시 저장소 연결을 확인하고 있습니다.':''}</p></form><p class="task-side-note">예상 작업량은 ${t.minutes}분입니다. 시작한 날 끝내지 않아도 됩니다. 작업 중 언제든 나갔다가 이어서 제출할 수 있습니다.</p></aside></div>`}
function stage(a){return `<span class="stage" role="status" title="정확한 완료율이나 남은 질문 수를 의미하지 않습니다"><i class="punch" aria-hidden="true"></i>${a.turn?'이해도 확인':'제출물 확인'}</span>`}
function message(m){return `<div class="message ${m.role}"><div class="message-author">${m.role==='user'?'나의 설명':'학습 파트너 · AI 예시'}</div><div class="message-text">${esc(m.text)}</div></div>`}
function source(a){const t=tasks[a.taskId];return `<details class="source" ${window.matchMedia('(min-width:821px)').matches?'open':''}><summary>제출한 작업물</summary><div class="source-inner"><div class="source-meta"><span>${esc(repoName(a.repo))}</span><code>${esc(t.branch)}</code></div><div class="code-panel"><div class="code-file">${esc(t.file)} · 예시</div><pre><code>${esc(t.sample)}</code></pre></div><p class="notice" style="font-size:11px">실제 저장소를 읽지 않은 예시입니다.</p></div></details>`}
function assessmentView(){const a=state.active,t=tasks[a.taskId];return `<button class="link-button back" data-go="task">과제 다시 보기</button><header class="assessment-heading"><div><h1>${esc(t.concept)}</h1></div>${stage(a)}</header><div class="assessment-layout"><section class="chat" aria-label="이해도 확인 대화"><div class="chat-header"><strong>코드에서 시작하는 대화</strong><small>예시 응답</small></div><div class="chat-log" id="chat-log" role="log" aria-live="polite" aria-label="평가 대화">${a.messages.map(message).join('')}</div><form class="chat-form" id="chat-form"><label for="answer">나의 설명</label><textarea id="answer" placeholder="작업물의 흐름을 따라 편하게 설명해 주세요." required maxlength="5000">${esc(a.draft)}</textarea><div class="chat-actions">${a.turn?'<button class="link-button" type="button" data-action="finish">대화 마치고 피드백 보기</button>':''}<button class="primary" type="submit">답변 보내기</button></div></form></section><aside class="assessment-side">${source(a)}<section class="assessment-note"><h2>이런 부분을 함께 살펴봅니다</h2><ul><li>작성한 내용이 실제로 동작하는 방식</li><li>그렇게 구현하거나 설명한 이유</li><li>다른 상황에 적용했을 때의 변화</li></ul></section></aside></div>`}
function heatmap(){const today=new Date();today.setHours(0,0,0,0);const start=new Date(today);start.setDate(start.getDate()-start.getDay()-25*7);const counts={};state.activity.forEach(d=>counts[d]=(counts[d]||0)+1);return `<section class="activity"><div class="activity-head"><h2>학습 활동</h2><span>최근 26주</span></div><div class="heatmap" role="img" aria-label="최근 26주 활동 기록. 색이 짙을수록 학습 활동이 많습니다.">${Array.from({length:182},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);const count=counts[day(d)]||0;return `<span class="heat-cell ${d>today?'future':''}" data-level="${Math.min(3,count)}" title="${day(d)} · 활동 ${count}회"></span>`}).join('')}</div><div class="heat-labels"><span>${start.getMonth()+1}월 ${start.getDate()}일부터</span><span>오늘까지 · 진할수록 많은 활동</span></div></section>`}
function historyView(){return `<header class="page-title"><div><h1>학습 기록</h1><p>수행한 과제와 대화, 피드백을 다시 꺼내 봅니다.</p></div></header><div class="history-grid"><div>${heatmap()}<div class="section-head"><h2>완료한 평가</h2><span>${state.history.length}건</span></div>${state.history.length?`<div class="history-list">${[...state.history].reverse().map(recordRow).join('')}</div>`:'<div class="empty"><h3>아직 완료한 평가가 없습니다.</h3><p>첫 과제를 마치면 대화와 피드백이 이곳에 저장됩니다.</p><div class="actions"><button class="primary" data-go="home">첫 과제 보러 가기</button></div></div>'}</div><aside class="history-side"><h2 style="font-size:15px;margin-bottom:12px">기록에 남는 것</h2><p class="small muted">과제 안내와 제출물 예시, 평가 대화, PASS·FAIL 결과와 보완점을 함께 보관합니다.</p><div class="divider"></div><p class="small muted">이 프로토타입의 기록은 현재 브라우저에 저장됩니다. 새로고침 후에도 이어서 볼 수 있습니다.</p></aside></div>`}
function shortDate(d){return new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit'}).format(new Date(d))}
function resultView(){const r=state.history.find(x=>x.id===selected?.id);if(!r)return '<h1>기록을 찾을 수 없습니다.</h1><button class="link-button" data-go="history">학습 기록으로</button>';const t=tasks[r.taskId],pass=r.outcome==='pass';return `<button class="link-button back" data-go="${selected.fromHistory?'history':'home'}">${selected.fromHistory?'기록':'학습'}으로 돌아가기</button><div class="result-layout"><article class="result-document"><div class="result-status ${pass?'':'fail'}"><strong>${pass?'PASS':'FAIL'}</strong><span>${shortDate(r.date)} · 예시 평가 결과</span></div><h1>${esc(t.title)}</h1><p class="result-summary">${pass?'핵심 개념을 이해하고 적용했습니다.':'보완할 부분을 확인하고 다시 시도해 보세요.'}</p><section class="feedback-section"><h2>잘 이해한 부분</h2><p>${esc(t.good)}</p></section><section class="feedback-section"><h2>${pass?'더 살펴볼 부분':'보완할 부분'}</h2><p>${esc(t.improve)}</p></section><section class="feedback-section"><h2>${pass?'이어서 배울 개념':'이렇게 다시 시도해 보세요'}</h2><p>${esc(pass?t.next:t.retry)}</p></section><div class="result-actions"><button class="primary" ${pass?'data-go="home"':state.active?'data-action="resume"':`data-retry="${esc(r.id)}"`}>${pass?'다음 과제 보기':state.active?'진행 중인 과제 이어하기':'보완하고 다시 도전'}</button><button class="link-button" data-go="history">전체 학습 기록</button></div><details class="transcript"><summary>평가 대화 다시 보기</summary><div class="chat-log">${r.messages.map(message).join('')}</div></details><p class="notice" style="font-size:11px">실제 답변을 채점한 결과가 아닌 피드백 예시입니다.</p></article><aside class="result-side">${miniMap(r.taskId)}<p class="small muted">${pass?'이 컨트롤을 펀치했습니다.':'이 컨트롤은 아직 펀치하지 못했습니다.'}</p>${source(r)}<details class="read-task"><summary>과제 안내 다시 보기</summary><p>${esc(t.problem)}</p><ul>${t.requirements.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details></aside></div>`}
function newAttempt(id){return {taskId:id,repo:typeof state.defaultRepo==='string'?state.defaultRepo:state.repo,stage:'task',turn:0,draft:'',messages:[]}}
function start(id){if(!owns(tasks,id))return;if(state.active){if(state.active.taskId!==id)toast('현재 과제를 마친 뒤 새 과제를 시작할 수 있습니다.');go(state.active.stage==='chat'?'assessment':'task');return}state.active=newAttempt(id);activity();go('task')}
function repoName(s){try{return new URL(s).pathname.replace(/^\//,'').replace(/\/$/,'')}catch{return s}}
function validRepo(s){try{const u=new URL(s.trim());return u.protocol==='https:'&&u.hostname==='github.com'&&!u.port&&!u.username&&!u.password&&!u.search&&!u.hash&&/^\/[A-Za-z0-9_-]+\/[A-Za-z0-9_.-]+\/?$/.test(u.pathname)}catch{return false}}
function finish(outcome){if(!state.active||state.active.stage!=='chat'||replyLoading||state.active.pending){toast('대화 응답을 받은 뒤 평가를 마칠 수 있습니다.');return}capture();if(state.active.draft.trim())state.active.messages.push({role:'user',text:state.active.draft.trim()});state.active.draft='';const r=JSON.parse(JSON.stringify(state.active));r.id=typeof crypto.randomUUID==='function'?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;r.date=new Date().toISOString();r.outcome=outcome;state.history.push(r);state.active=null;selected={id:r.id,fromHistory:false};activity();go('result')}
function editProfile(){editing=true;editDraft={...state.profile};editStep=0;go('onboarding')}
function authView(){return `<div class="auth-layout"><section class="auth-info"><button class="link-button back" data-go="landing">서비스 소개로</button><h1>smallbyte에 로그인</h1><p>GitHub 계정 하나로 시작합니다. 처음이라면 로그인 후 학습 방향을 설정합니다.</p>${steps()}${miniMap(recommended())}</section><section class="auth-panel" aria-label="GitHub 로그인"><h2>GitHub로 계속하기</h2><p>과제를 제출할 때 사용할 GitHub 계정으로 연결하세요.</p><div class="auth-identity"><span class="identity-avatar">${icon('github')}</span><div><strong>GitHub 계정</strong><small>인증 후 과제 수행과 학습 기록을 이어갑니다.</small></div></div><button class="primary" data-action="authenticate" ${authStatus==='loading'?'disabled':''}>${icon('github')} ${authStatus==='loading'?'GitHub 연결 중…':authStatus==='error'?'다시 로그인하기':'GitHub로 로그인'}</button>${authStatus==='loading'?'<p class="auth-progress" role="status">GitHub 인증을 진행하고 있습니다.</p><button class="link-button" data-action="cancel-auth">로그인 취소</button>':authStatus==='error'?'<div class="recovery" role="alert"><strong>GitHub에 연결하지 못했습니다.</strong><p>잠시 후 다시 시도하세요. 프로토타입 도구에서 로그인 상태를 성공으로 바꿔 재시도할 수 있습니다.</p></div>':authStatus==='cancelled'?'<p class="auth-message" role="status">로그인을 취소했습니다. 준비되면 다시 시작할 수 있습니다.</p>':''}<p class="notice">이 프로토타입에서는 예시 GitHub 계정 <code>@jiwoo</code>로 연결합니다. 실제 인증 정보는 입력하지 않습니다.</p></section></div>`}
function mypageView(){const name=state.account?.name||'지우';return `<header class="page-title"><div><h1>마이페이지</h1><p>계정과 학습 방향, 기본 제출 저장소를 관리합니다.</p></div></header><div class="profile-layout"><aside class="profile-account"><span class="identity-avatar">${icon('user')}</span><h2>${esc(name)}</h2><p>@jiwoo · GitHub 예시 계정</p><span class="tag olive">GitHub 연결됨</span>${courseProgress()}<div class="divider"></div><button class="link-button" data-go="history">나의 학습 기록 보기</button></aside><div class="profile-sections"><section class="profile-section"><h2>계정 정보</h2><dl class="profile-definition"><div><dt>로그인 방식</dt><dd>GitHub</dd></div><div><dt>GitHub 계정</dt><dd>@jiwoo</dd></div><div><dt>연결 상태</dt><dd>연결됨 · 프로토타입 시뮬레이션</dd></div></dl><form class="profile-form" id="account-form"><div><label for="display-name">표시 이름</label><input id="display-name" name="name" value="${esc(name)}" maxlength="30" required autocomplete="nickname"><p class="field-help">학습 화면과 계정에 표시할 이름입니다.</p></div><button class="primary" type="submit">이름 저장</button></form></section><section class="profile-section"><h2>학습 방향</h2><p>추천 과제를 고를 때 반영합니다. 진행 중인 과제는 그대로 유지됩니다.</p><form class="profile-form" id="preferences-form">${Object.entries(choices).map(([key,options])=>`<div><label for="profile-${key}">${{purpose:'학습 목적',goal:'관심 분야 · 목표 직무',experience:'현재 경험'}[key]}</label><select name="${key}" id="profile-${key}">${options.map(([value,title])=>`<option value="${value}" ${state.profile[key]===value?'selected':''}>${title}</option>`).join('')}</select></div>`).join('')}<button class="primary" type="submit">학습 방향 저장</button></form></section><section class="profile-section"><h2>기본 제출 저장소</h2><p>새 과제를 시작할 때 자동 입력할 GitHub 저장소입니다. 과제마다 다른 주소를 제출할 수도 있습니다.</p><form class="profile-form" id="default-repo-form" novalidate><div><label for="default-repo">GitHub 저장소 URL</label><input id="default-repo" name="repository" type="url" value="${esc(state.defaultRepo||'')}" placeholder="https://github.com/jiwoo/cs-lab" aria-describedby="default-repo-error"><p class="error" id="default-repo-error" role="alert"></p><p class="field-help">비워서 저장하면 기본 저장소 설정을 해제합니다.</p></div><button class="primary" type="submit">기본 저장소 저장</button></form></section><section class="profile-section"><h2>계정</h2><p>로그아웃해도 이 브라우저의 학습 기록과 작성 중인 내용은 유지됩니다.</p><div class="actions"><button class="secondary" data-action="logout">로그아웃</button><button class="link-button" data-go="history">학습 기록으로 이동</button></div></section><p class="settings-saved" id="settings-saved" role="status">${esc(settingsSaved)}</p></div></div>`}
function previewView(){const t=tasks[previewId],same=state.active?.taskId===previewId;return `<button class="link-button back" data-go="home">학습으로 돌아가기</button><div class="task-layout"><article class="task-document"><h1>${esc(t.title)}</h1><div class="task-kicker"><span class="tag">컨트롤 ${taskNumber(previewId)}</span><span class="meta"><span>${esc(t.area)}</span><span>${esc(t.language)}</span><span>예상 ${t.minutes}분</span></span></div>${miniMap(previewId)}<p>${esc(t.problem)}</p><section class="document-section"><h2>완료 조건</h2><ul class="requirements">${t.requirements.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></section><section class="document-section"><h2>과제 예시</h2><div class="code-panel"><div class="code-file">${esc(t.file)}</div><pre><code>${esc(t.starter)}</code></pre></div></section></article><aside class="preview-side"><h2>${same?'진행 중인 과제':state.active?'과제 미리보기':'이 컨트롤 시작하기'}</h2><p>예상 작업량 ${t.minutes}분. 제출 마감 없이 자신의 속도로 학습합니다.</p><p>지정 브랜치 <code>${esc(t.branch)}</code>에 작업물을 작성합니다.</p>${!state.active?`<button class="primary" data-begin="${previewId}">과제 시작하기</button>`:same?'<button class="primary" data-action="resume">이 과제 이어하기</button>':'<p>다른 과제를 진행 중입니다. 해당 과제를 마친 뒤 새 과제를 시작할 수 있습니다.</p><button class="primary" data-action="resume">진행 중인 과제 이어하기</button>'}<div><button class="link-button" data-go="home">다른 과제 살펴보기</button></div></aside></div>`}
function submissionRecovery(){return `<div class="recovery" role="alert"><strong>${submissionError==='access'?'저장소에 접근할 수 없습니다.':'지정 브랜치를 찾지 못했습니다.'}</strong><p>${submissionError==='access'?'주소가 올바른지, 연결한 GitHub 계정이 저장소에 접근할 수 있는지 확인하세요.':`저장소에 ${esc(tasks[state.active.taskId].branch)} 브랜치를 만들고 작업물을 push한 뒤 다시 확인하세요.`}</p><button class="link-button" type="button" data-action="retry-submission">작업물 다시 확인</button></div>`}
function enhanceChat(){const a=state.active;const blocked=replyLoading||a.pending;const form=document.getElementById('chat-form');if(blocked){form.querySelector('textarea').disabled=true;form.querySelector('button[type=submit]').disabled=true;form.querySelector('[data-action=finish]')?.remove();form.insertAdjacentHTML('beforebegin',replyLoading?'<p class="chat-pending" role="status">작업물과 설명을 살펴보고 있습니다…</p>':'<div class="recovery" role="alert" style="margin:0 23px 18px"><strong>응답을 받지 못했습니다.</strong><p>보낸 설명은 저장되어 있습니다. 같은 메시지를 중복 제출하지 않고 응답만 다시 요청합니다.</p><button class="link-button" data-action="retry-reply">응답 다시 받기</button></div>')}}
function historyRows(){const records=[...state.history].reverse().filter(r=>(historyFilter==='all'||r.outcome===historyFilter)&&tasks[r.taskId].title.toLowerCase().includes(historyQuery.trim().toLowerCase()));return records.length?records.map(recordRow).join(''):`<div class="empty"><h3>조건에 맞는 기록이 없습니다.</h3><p>다른 과제명을 검색하거나 필터를 초기화해 주세요.</p><button class="link-button" data-action="clear-filters">검색 · 필터 초기화</button></div>`}
function enhanceHistory(){if(!state.history.length)return;const list=main.querySelector('.history-list');list.insertAdjacentHTML('beforebegin',`<div class="filter-bar"><div><label for="history-search">과제명 검색</label><input id="history-search" type="search" value="${esc(historyQuery)}" placeholder="과제명 입력" autocomplete="off"></div><div><label for="history-filter">평가 결과</label><select id="history-filter"><option value="all" ${historyFilter==='all'?'selected':''}>전체</option><option value="pass" ${historyFilter==='pass'?'selected':''}>PASS</option><option value="fail" ${historyFilter==='fail'?'selected':''}>FAIL</option></select></div></div><p class="filter-result" id="filter-result" role="status"></p>`);updateHistoryResults()}
function updateHistoryResults(){const list=main.querySelector('.history-list');if(!list)return;list.innerHTML=historyRows();document.getElementById('filter-result').textContent=`검색 결과 ${list.querySelectorAll('.history-row').length}건`}
function authenticate(){if(authStatus==='loading')return;authStatus='loading';render();authTimer=setTimeout(()=>{if(page!=='login')return;if(simulation.login==='error'){authStatus='error';render();document.querySelector('[data-action=authenticate]').focus();return}authStatus='idle';state.signedIn=true;if(!state.account)state.account={name:'지우',handle:'jiwoo'};editing=false;go(state.onboardingComplete?'home':'onboarding')},750)}
function connectRepository(){if(connecting||!state.active)return;capture();submissionError='';if(!validRepo(state.active.repo)){const input=document.getElementById('repo');input.setAttribute('aria-invalid','true');document.getElementById('repo-error').textContent='https://github.com/사용자/저장소 형식으로 입력하세요.';input.focus();return}state.active.repo=state.active.repo.trim();state.repo=state.active.repo;connecting=true;save();render();connectionTimer=setTimeout(()=>{if(page!=='task'||!state.active)return;connecting=false;if(simulation.repository!=='success'){submissionError=simulation.repository;render();document.querySelector('[data-action=retry-submission]').focus();return}state.active.stage='chat';if(!state.active.messages.length)state.active.messages=[{role:'ai',text:tasks[state.active.taskId].prompts[0]}];activity();go('assessment')},650)}
function requestReply(){if(replyLoading||!state.active?.pending)return;replyLoading=true;save();render();replyTimer=setTimeout(()=>{if(page!=='assessment'||!state.active)return;replyLoading=false;if(simulation.reply==='error'){render();document.querySelector('[data-action=retry-reply]').focus();return}const a=state.active;a.turn++;a.messages.push({role:'ai',text:tasks[a.taskId].prompts[a.turn]||'같은 원리를 다른 상황에 적용하면 어떻게 될까요? 아직 설명하기 어려운 부분이나 더 확인하고 싶은 내용을 이야기해 주세요.'});a.pending=false;activity();save();render();const log=document.getElementById('chat-log');log.scrollTop=log.scrollHeight;document.getElementById('answer').focus({preventScroll:true})},700)}
function loadDemo(){state=blank();state.signedIn=true;state.onboardingComplete=true;state.profile={purpose:'career',goal:'backend',experience:'experienced'};state.onboardingStep=2;state.repo='https://github.com/jiwoo/cs-lab';for(const [id,outcome,ago] of [['http','pass',4],['semaphore','fail',1]]){const date=new Date();date.setDate(date.getDate()-ago);state.history.push({...newAttempt(id),stage:'chat',turn:1,messages:[{role:'ai',text:tasks[id].prompts[0]},{role:'user',text:id==='http'?'상태 코드는 처리 결과이고 본문은 실제 콘텐츠입니다.':'자리가 없으면 대기열에서 기다립니다. 자리가 반환되면 다음 요청을 실행합니다.'},{role:'ai',text:tasks[id].prompts[1]}],id:`example-${id}`,date:date.toISOString(),outcome});state.activity.push(day(date))}state.active=newAttempt('semaphore');editing=false;selected=null;go('home',false);toast('예시 학습 기록을 불러왔습니다.')}
document.addEventListener('click',async e=>{
 if(e.target.closest('.skip')){e.preventDefault();main.focus({preventScroll:true});main.scrollIntoView({block:'start',behavior:'instant'});return}
 const route=e.target.closest('[data-go]');if(route){e.preventDefault();settingsSaved='';go(route.dataset.go);return}
 const task=e.target.closest('[data-start]');if(task){previewId=task.dataset.start;go('preview');return}
 const begin=e.target.closest('[data-begin]');if(begin){submissionError='';start(begin.dataset.begin);return}
 const record=e.target.closest('[data-record]');if(record){selected={id:record.dataset.record,fromHistory:true};go('result');return}
 const retry=e.target.closest('[data-retry]');if(retry){const r=state.history.find(x=>x.id===retry.dataset.retry);if(r){submissionError='';start(r.taskId)}return}
 const outcome=e.target.closest('[data-outcome]');if(outcome){finish(outcome.dataset.outcome);return}
 const button=e.target.closest('[data-action]');if(!button)return;
 switch(button.dataset.action){
  case 'login':authStatus='idle';go('login');break;
  case 'authenticate':authenticate();break;
  case 'cancel-auth':clearTimeout(authTimer);authStatus='cancelled';render();document.querySelector('[data-action=authenticate]').focus();break;
  case 'logout':capture();state.signedIn=false;editing=false;authStatus='idle';go('login');break;
  case 'resume':if(state.active){submissionError='';go(state.active.stage==='chat'?'assessment':'task')}break;
  case 'onboard-back':if(editing)editStep=Math.max(0,editStep-1);else state.onboardingStep=Math.max(0,state.onboardingStep-1);go('onboarding');break;
  case 'edit-profile':go('mypage');break;
  case 'cancel-edit':editing=false;go('mypage');break;
  case 'finish':finish('pass');break;
  case 'retry-submission':connectRepository();break;
  case 'retry-reply':requestReply();break;
  case 'clear-filters':historyQuery='';historyFilter='all';render();document.getElementById('history-search')?.focus();break;
  case 'reset':state=blank();editing=false;selected=null;previewId=null;historyQuery='';historyFilter='all';submissionError='';authStatus='idle';Object.assign(simulation,{login:'success',repository:'success',reply:'success'});go('landing',false);break;
  case 'demo':historyQuery='';historyFilter='all';submissionError='';loadDemo();break;
  case 'copy':{const branch=tasks[state.active.taskId].branch;try{await navigator.clipboard.writeText(branch);toast('브랜치명을 복사했습니다.')}catch{toast(`복사할 브랜치: ${branch}`)}break}
 }
});
document.addEventListener('change',e=>{
 if(e.target.matches('[data-simulation]')){simulation[e.target.dataset.simulation]=e.target.value;return}
 if(e.target.id==='history-filter'){historyFilter=e.target.value;updateHistoryResults();return}
 if(page==='onboarding'&&e.target.type==='radio'){const p=editing?editDraft:state.profile;p[e.target.name]=e.target.value;if(!editing)save()}
});
document.addEventListener('input',e=>{
 if(e.target.id==='history-search'){historyQuery=e.target.value;updateHistoryResults();return}
 if(e.target.id==='repo'&&state.active){state.active.repo=e.target.value;e.target.removeAttribute('aria-invalid');document.getElementById('repo-error').textContent='';save()}
 if(e.target.id==='answer'&&state.active){state.active.draft=e.target.value;save()}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='onboarding-form'){e.preventDefault();const s=editing?editStep:state.onboardingStep,key=['purpose','goal','experience'][s],value=new FormData(e.target).get(key);if(!choices[key].some(c=>c[0]===value))return;const p=editing?editDraft:state.profile;p[key]=value;if(s<2){if(editing)editStep++;else state.onboardingStep++;go('onboarding')}else if(validProfile(p)){state.profile={...p};state.onboardingComplete=true;state.onboardingStep=2;editing=false;go('home')}return}
 if(e.target.id==='submit-form'){e.preventDefault();connectRepository();return}
 if(e.target.id==='chat-form'){e.preventDefault();if(replyLoading||state.active.pending)return;capture();const a=state.active,text=a.draft.trim();if(!text)return;a.messages.push({role:'user',text});a.draft='';a.pending=true;requestReply();return}
 if(['account-form','preferences-form','default-repo-form'].includes(e.target.id)){
  e.preventDefault();const data=new FormData(e.target);
  if(e.target.id==='account-form'){const name=String(data.get('name')).trim();if(!name){document.getElementById('display-name').setCustomValidity('표시 이름을 입력하세요.');document.getElementById('display-name').reportValidity();return}state.account.name=name;settingsSaved='표시 이름을 저장했습니다.'}
  if(e.target.id==='preferences-form'){const p=Object.fromEntries(data);if(!validProfile(p))return;state.profile=p;settingsSaved='학습 방향을 저장했습니다. 다음 과제 추천에 반영합니다.'}
  if(e.target.id==='default-repo-form'){const repo=String(data.get('repository')).trim();if(repo&&!validRepo(repo)){const input=document.getElementById('default-repo');input.setAttribute('aria-invalid','true');document.getElementById('default-repo-error').textContent='https://github.com/사용자/저장소 형식으로 입력하세요.';input.focus();return}state.defaultRepo=repo;settingsSaved=repo?'기본 제출 저장소를 저장했습니다.':'기본 제출 저장소 설정을 해제했습니다.'}
  savedForm=e.target.id;save();render();document.getElementById('settings-saved').setAttribute('tabindex','-1');document.getElementById('settings-saved').focus({preventScroll:true});
 }
});
document.addEventListener('input',e=>{if(e.target.id==='display-name')e.target.setCustomValidity('');if(e.target.id==='default-repo'){e.target.removeAttribute('aria-invalid');document.getElementById('default-repo-error').textContent=''}});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-map-focus]');
 if(b){const m=document.querySelector('.course-map');if(!m)return;const leg=b.dataset.mapFocus==='leg';mapFocus=leg?'leg':'course';m.classList.toggle('is-leg',leg);document.querySelectorAll('[data-map-focus]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return}
 const c=e.target.closest('.map-control');
 if(c&&c.dataset.control){e.preventDefault();previewId=c.dataset.control;go('preview');return}
});
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter'&&e.key!==' ')return;
 const c=e.target.closest?.('.map-control');
 if(!c||!c.dataset.control)return;
 e.preventDefault();previewId=c.dataset.control;go('preview');
});
const linkControl=id=>document.querySelectorAll(`[data-control="${id}"]`).forEach(x=>x.classList.add('is-linked'));
const unlinkControl=id=>document.querySelectorAll(`[data-control="${id}"]`).forEach(x=>x.classList.remove('is-linked'));
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-control]');if(el)linkControl(el.dataset.control)});
document.addEventListener('mouseout',e=>{const el=e.target.closest('[data-control]');if(!el)return;const to=e.relatedTarget?.closest?.('[data-control]');if(to&&to.dataset.control===el.dataset.control)return;unlinkControl(el.dataset.control)});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-control]');if(el)linkControl(el.dataset.control)});
document.addEventListener('focusout',e=>{const el=e.target.closest('[data-control]');if(el)unlinkControl(el.dataset.control)});
window.addEventListener('popstate',()=>readRoute(true));
readRoute(true);
</script>
</body>
</html>
