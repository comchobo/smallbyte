function simulationField(key,name,values){let options='';for(let i=0;i<values.length;i+=2)options+=`<option value="${values[i]}" ${simulation[key]===values[i]?'selected':''}>${values[i+1]}</option>`;return `<label>${name} <select data-simulation="${key}" aria-label="${name} 시뮬레이션">${options}</select></label>`}
function landingView(){return loginView()}
function loginView(){return `<div class="entry"><section class="entry-copy"><h1>지식을 읽는 데서,<br>직접 만드는 데까지.</h1><p>CS와 개발 지식을 작은 프로젝트로 배웁니다. 관심 분야와 경험에 맞는 과제를 수행하고, 대화로 이해를 확인하세요.</p><button class="primary" data-action="login">${icon('github')} GitHub로 시작하기</button><p class="notice">첫 로그인 후, 학습 목적과 경험을 설정합니다.</p><div class="entry-process"><span><strong>나에게 맞는 과제</strong>정해진 순서 없이</span><span><strong>하루 이하의 작업량</strong>마감 없이 내 속도로</span><span><strong>코드에 대한 대화</strong>이해와 성장 중심으로</span></div></section><section class="entry-example" aria-label="학습 과제 예시"><div class="example-head"><span>이런 과제를 만납니다</span><span>예상 60분</span></div><div class="example-body"><span class="tag">CS · 동시성</span><h2>세마포어로<br>요청 제어하기</h2><p>동시에 실행되는 요청은 3개만.<br>자리가 생기면 다음 작업을 실행하도록 만듭니다.</p><div class="example-code"><pre>const semaphore = new Semaphore(3);

await semaphore.acquire();
try {

} finally {
  semaphore.release();
}</pre></div></div><div class="example-bottom">완성한 코드에서 시작하는 질문 · “네 번째 요청은 어떻게 되나요?”</div></section></div>`}
function onboardingView(){const p=editing?editDraft:state.profile,s=editing?editStep:state.onboardingStep,key=['purpose','goal','experience'][s];const titles=['무엇을 위해 배우고 있나요?','어떤 분야가 궁금한가요?','어느 정도 경험이 있나요?'];return `<div class="onboarding"><aside class="onboard-aside"><h1>${editing?'학습 방향 바꾸기':'나에게 맞는 시작점을 찾습니다.'}</h1><p>${editing?'변경한 정보는 다음 과제 추천에 반영합니다.':'GitHub 연결을 마쳤습니다. 세 가지만 알려주시면 첫 과제를 추천합니다.'}</p><ol class="step-list">${['학습 목적','관심 분야','현재 경험'].map((t,i)=>`<li class="${i===s?'current':i<s?'done':''}" ${i===s?'aria-current="step"':''}><span class="step-number">${i+1}</span><span>${t}</span></li>`).join('')}</ol></aside><form class="onboard-panel" id="onboarding-form"><h2>${titles[s]}</h2><p>${['지금 배우려는 이유에 가장 가까운 것을 골라 주세요.','직무가 정해지지 않았다면 탐색 중을 선택해도 됩니다.','잘하는지 평가하는 질문이 아닙니다. 시작할 과제를 고르는 데만 사용합니다.'][s]}</p><fieldset class="option-list" aria-label="${titles[s]}">${choices[key].map(([value,title,desc])=>`<label class="option"><input type="radio" name="${key}" value="${value}" ${p[key]===value?'checked':''} required><span><strong>${title}</strong><small>${desc}</small></span></label>`).join('')}</fieldset>${s===2?`<div class="onboard-summary"><strong>지금까지 선택한 내용</strong><br>${esc(label('purpose',p.purpose))}<br>${esc(label('goal',p.goal))}</div>`:''}<div class="onboard-actions">${s>0?'<button class="link-button" type="button" data-action="onboard-back">이전</button>':editing?'<button class="link-button" type="button" data-action="cancel-edit">취소</button>':''}<button class="primary" type="submit">${s===2?editing?'변경 내용 저장':'첫 과제 만나기':'다음'}</button></div></form></div>`}
function homeView(){const active=state.active,id=active?.taskId||recommended(),t=tasks[id];const passed=new Set(state.history.filter(r=>r.outcome==='pass').map(r=>r.taskId));return `<header class="page-title"><div><h1>나의 학습</h1><p>${active?'진행하던 과제를 이어서 학습하세요.':'관심 분야와 경험을 바탕으로 고른 과제입니다.'}</p></div><span class="small muted">${new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric'}).format(new Date())}</span></header><div class="learning-grid"><div><article class="feature"><div class="feature-body"><span class="tag">${active?'진행 중':passed.has(id)?'다시 학습하기':'추천 과제'}</span><h2>${esc(t.title)}</h2><div style="margin-top:12px">${meta(t)}</div><p class="feature-description">${esc(t.description)}</p><div class="feature-preview"><div><h3>직접 해 볼 일</h3><p>${esc(t.requirements[0])}</p></div><div><h3>학습 후 설명할 수 있는 것</h3><p>${esc(t.prompts[0].split('?')[0])}</p></div></div><p class="feature-reason">${esc(reason(id))}</p></div><div class="feature-bottom"><span>${active?(active.stage==='chat'?'작업물을 연결했습니다. 대화를 이어갈 수 있습니다.':'과제 안내를 확인했습니다. 작업 후 제출해 주세요.'):'미리 준비된 과제 · 제출 마감 없음'}</span><button class="primary" ${active?'data-action="resume"':`data-start="${id}"`}>${active?(active.stage==='chat'?'대화 이어하기':'과제 이어하기'):'과제 시작하기'}</button></div></article><div class="section-head"><h2>함께 살펴볼 과제</h2><span>관심과 경험을 반영한 순서</span></div><div class="task-list">${ranked().filter(k=>k!==id).map(k=>`<button class="task-row" data-start="${k}"><span><strong>${esc(tasks[k].title)}</strong><p>${esc(tasks[k].concept)} · ${esc(tasks[k].language)}${passed.has(k)?' · 학습 완료':''}</p></span><span>${tasks[k].minutes}분</span></button>`).join('')}</div>${active?'<p class="notice">다른 과제는 현재 과제를 마친 뒤 시작할 수 있습니다.</p>':''}</div><aside class="learning-aside"><section class="aside-section"><h2>나의 학습 방향</h2><dl class="profile-facts"><div><dt>학습 목적</dt><dd>${esc(label('purpose',state.profile.purpose))}</dd></div><div><dt>관심 분야</dt><dd>${esc(label('goal',state.profile.goal))}</dd></div><div><dt>현재 경험</dt><dd>${esc(label('experience',state.profile.experience))}</dd></div></dl><button class="link-button" data-action="edit-profile">학습 방향 수정</button></section><section class="aside-section"><h2>하나의 과제를 마치는 과정</h2>${steps()}</section></aside></div>`}
function taskView(){const a=state.active,t=tasks[a.taskId];return `<button class="link-button back" data-go="home">학습으로 돌아가기</button><div class="task-layout"><article class="task-document">${meta(t)}<h1>${esc(t.title)}</h1><p>${esc(t.problem)}</p><section class="document-section"><h2>완료 조건</h2><ul class="requirements">${t.requirements.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></section><section class="document-section"><h2>${t.language==='코드 작성 없이'?'살펴볼 예시':'시작 코드'}</h2><p class="small muted">${t.language==='코드 작성 없이'?'예시를 참고해 자신의 설명을 작성하세요.':'아래 사용 예시가 동작하도록 구현하세요. 구현 방식은 자유입니다.'}</p><div class="code-panel"><div class="code-file">${esc(t.file)} · 과제 예시</div><pre><code>${esc(t.starter)}</code></pre></div></section><section class="document-section"><h2>제출 후에는</h2><p class="small muted">작업물에 대한 질문에 답하며 개념을 확인합니다. 정답만 맞히기보다, 왜 그렇게 동작하는지 자신의 언어로 설명해 주세요.</p></section></article><aside><form class="task-submission" id="submit-form" novalidate><h2>작업물 연결</h2><p>아래 브랜치에서 작업한 뒤 저장소 주소를 제출하세요.</p><span class="field-label">이 과제의 지정 브랜치</span><div class="branch"><code>${esc(t.branch)}</code><button class="copy" type="button" data-action="copy" aria-label="브랜치명 복사">${icon('copy')}</button></div><label class="field-label" for="repo">GitHub 저장소 URL</label><input class="url-input" id="repo" type="url" autocomplete="url" value="${esc(a.repo)}" placeholder="https://github.com/name/cs-lab" aria-describedby="repo-error repo-help" required ${connecting?'disabled':''}><p class="error" id="repo-error" role="alert"></p><p class="notice" id="repo-help">이 브랜치에 작업물을 push하세요. ${t.language==='코드 작성 없이'?'GitHub에서 README.md를 직접 작성해도 됩니다.':'파일이나 경로를 따로 지정할 필요는 없습니다.'}</p><button class="primary" type="submit" ${connecting?'disabled':''}>${connecting?'작업물 확인 중…':'제출하고 대화하기'}</button><p class="status" role="status">${connecting?'예시 저장소 연결을 확인하고 있습니다.':''}</p></form><p class="task-side-note">예상 작업량은 ${t.minutes}분입니다. 시작한 날 끝내지 않아도 됩니다. 작업 중 언제든 나갔다가 이어서 제출할 수 있습니다.</p></aside></div>`}
function stage(a){return `<span class="stage" role="img" aria-label="대략적인 진행 단계: ${a.turn?'이해도 확인':'제출물 확인'}" title="정확한 완료율이나 남은 질문 수를 의미하지 않습니다"><svg viewBox="0 0 20 20" aria-hidden="true"><circle class="ring-track" cx="10" cy="10" r="8"/><circle class="ring-fill" cx="10" cy="10" r="8" style="--offset:${a.turn>2?10:a.turn?22:38}"/></svg>${a.turn?'이해도 확인':'제출물 확인'}</span>`}
function message(m){return `<div class="message ${m.role}"><div class="message-author">${m.role==='user'?'나의 설명':'학습 파트너 · AI 예시'}</div><div class="message-text">${esc(m.text)}</div></div>`}

function assessmentView(){const a=state.active,t=tasks[a.taskId];return `<button class="link-button back" data-go="task">과제 다시 보기</button><header class="assessment-heading"><h1>${esc(t.concept)} · 이해도 확인</h1>${stage(a)}</header><div class="assessment-layout"><section class="chat" aria-label="이해도 확인 대화"><div class="chat-header"><strong>코드에서 시작하는 대화</strong><small>예시 응답</small></div><div class="chat-log" id="chat-log" role="log" aria-live="polite" aria-label="평가 대화">${a.messages.map(message).join('')}</div><form class="chat-form" id="chat-form"><label for="answer">나의 설명</label><textarea id="answer" placeholder="작업물의 흐름을 따라 편하게 설명해 주세요." required maxlength="5000">${esc(a.draft)}</textarea><div class="chat-actions">${a.turn?'<button class="link-button" type="button" data-action="finish">대화 마치고 피드백 보기</button>':''}<button class="primary" type="submit">답변 보내기</button></div></form></section><aside class="assessment-side">${source(a)}<section class="assessment-note"><h2>이런 부분을 함께 살펴봅니다</h2><ul><li>작성한 내용이 실제로 동작하는 방식</li><li>그렇게 구현하거나 설명한 이유</li><li>다른 상황에 적용했을 때의 변화</li></ul></section></aside></div>`}
function heatmap(){const today=new Date();today.setHours(0,0,0,0);const start=new Date(today);start.setDate(start.getDate()-start.getDay()-25*7);const counts={};state.activity.forEach(d=>counts[d]=(counts[d]||0)+1);return `<section class="activity"><div class="activity-head"><h2>학습 활동</h2><span>최근 26주</span></div><div class="heatmap" role="img" aria-label="최근 26주 활동 기록. 색이 짙을수록 학습 활동이 많습니다.">${Array.from({length:182},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);const count=counts[day(d)]||0;return `<span class="heat-cell ${d>today?'future':''}" data-level="${Math.min(3,count)}" title="${day(d)} · 활동 ${count}회"></span>`}).join('')}</div><div class="heat-labels"><span>${start.getMonth()+1}월 ${start.getDate()}일부터</span><span>오늘까지 · 진할수록 많은 활동</span></div></section>`}
function historyView(){return `<header class="page-title"><div><h1>학습 기록</h1><p>수행한 과제와 대화, 피드백을 다시 꺼내 봅니다.</p></div></header><div class="history-grid"><div>${heatmap()}<div class="section-head"><h2>완료한 평가</h2><span>${state.history.length}건</span></div>${state.history.length?`<div class="history-list">${[...state.history].reverse().map(r=>`<button class="history-row" data-record="${esc(r.id)}"><span><strong>${esc(tasks[r.taskId].title)}</strong><small>${esc(tasks[r.taskId].concept)} · 대화와 피드백</small></span><time datetime="${esc(r.date)}">${shortDate(r.date)}</time><span class="outcome ${r.outcome==='fail'?'fail':''}">${r.outcome.toUpperCase()}</span></button>`).join('')}</div>`:'<div class="empty"><h3>아직 완료한 평가가 없습니다.</h3><p>첫 과제를 마치면 대화와 피드백이 이곳에 저장됩니다.</p><div class="actions"><button class="primary" data-go="home">첫 과제 보러 가기</button></div></div>'}</div><aside class="history-side"><h2 style="font-size:15px;margin-bottom:12px">기록에 남는 것</h2><p class="small muted">과제 안내와 제출물 예시, 평가 대화, PASS·FAIL 결과와 보완점을 함께 보관합니다.</p><div class="divider"></div><p class="small muted">이 프로토타입의 기록은 현재 브라우저에 저장됩니다. 새로고침 후에도 이어서 볼 수 있습니다.</p></aside></div>`}
function shortDate(d){return new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit'}).format(new Date(d))}
function resultView(){const r=state.history.find(r=>r.id===selected?.id);if(!r)return '<h1>기록을 찾을 수 없습니다.</h1><button class="link-button" data-go="history">학습 기록으로</button>';const t=tasks[r.taskId],pass=r.outcome==='pass';return `<button class="link-button back" data-go="${selected.fromHistory?'history':'home'}">${selected.fromHistory?'기록':'학습'}으로 돌아가기</button><div class="result-layout"><article class="result-document"><div class="result-status ${pass?'':'fail'}"><strong>${pass?'PASS':'FAIL'}</strong><span>${shortDate(r.date)} · 예시 평가 결과</span></div><h1>${esc(t.title)}</h1><p class="result-summary">${pass?'핵심 개념을 이해하고 적용했습니다.':'보완할 부분을 확인하고 다시 시도해 보세요.'}</p><section class="feedback-section"><h2>잘 이해한 부분</h2><p>${esc(t.good)}</p></section><section class="feedback-section"><h2>${pass?'더 살펴볼 부분':'보완할 부분'}</h2><p>${esc(t.improve)}</p></section><section class="feedback-section"><h2>${pass?'이어서 배울 개념':'이렇게 다시 시도해 보세요'}</h2><p>${esc(pass?t.next:t.retry)}</p></section><div class="result-actions"><button class="primary" ${pass?'data-go="home"':state.active?'data-action="resume"':`data-retry="${esc(r.id)}"`}>${pass?'다음 과제 보기':state.active?'진행 중인 과제 이어하기':'보완하고 다시 도전'}</button><button class="link-button" data-go="history">전체 학습 기록</button></div><details class="transcript"><summary>평가 대화 다시 보기</summary><div class="chat-log">${r.messages.map(message).join('')}</div></details><p class="notice" style="font-size:11px">실제 답변을 채점한 결과가 아닌 피드백 예시입니다.</p></article><aside class="result-side">${source(r)}<details class="read-task"><summary>과제 안내 다시 보기</summary><p>${esc(t.problem)}</p><ul>${t.requirements.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details></aside></div>`}
function newAttempt(id){return {taskId:id,repo:typeof state.defaultRepo==='string'?state.defaultRepo:state.repo,stage:'task',turn:0,draft:'',messages:[]}}
function start(id){if(!owns(tasks,id))return;if(state.active){if(state.active.taskId!==id)toast('현재 과제를 마친 뒤 새 과제를 시작할 수 있습니다.');go(state.active.stage==='chat'?'assessment':'task');return}state.active=newAttempt(id);activity();go('task')}
function repoName(s){try{return new URL(s).pathname.replace(/^\//,'').replace(/\/$/,'')}catch{return s}}
function validRepo(s){try{const u=new URL(s.trim());return u.protocol==='https:'&&u.hostname==='github.com'&&!u.port&&!u.username&&!u.password&&!u.search&&!u.hash&&/^\/[A-Za-z0-9_-]+\/[A-Za-z0-9_.-]+\/?$/.test(u.pathname)}catch{return false}}
function finish(outcome){if(!state.active||state.active.stage!=='chat'||replyLoading||state.active.pending){toast('대화 응답을 받은 뒤 평가를 마칠 수 있습니다.');return}capture();if(state.active.draft.trim())state.active.messages.push({role:'user',text:state.active.draft.trim()});state.active.draft='';const r=JSON.parse(JSON.stringify(state.active));r.id=typeof crypto.randomUUID==='function'?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;r.date=new Date().toISOString();r.outcome=outcome;state.history.push(r);state.active=null;selected={id:r.id,fromHistory:false};activity();go('result')}
function editProfile(){editing=true;editDraft={...state.profile};editStep=0;go('onboarding')}
function authView(){return `<div class="auth-layout"><section class="auth-info"><button class="link-button back" data-go="landing">서비스 소개로</button><h1>smallbyte에 로그인</h1><p>GitHub 계정 하나로 시작합니다. 처음이라면 로그인 후 학습 방향을 설정합니다.</p>${steps()}</section><section class="auth-panel" aria-label="GitHub 로그인"><h2>GitHub로 계속하기</h2><p>과제를 제출할 때 사용할 GitHub 계정으로 연결하세요.</p><div class="auth-identity"><span class="identity-avatar">${icon('github')}</span><div><strong>GitHub 계정</strong><small>인증 후 과제 수행과 학습 기록을 이어갑니다.</small></div></div><button class="primary" data-action="authenticate" ${authStatus==='loading'?'disabled':''}>${icon('github')} ${authStatus==='loading'?'GitHub 연결 중…':authStatus==='error'?'다시 로그인하기':'GitHub로 로그인'}</button>${authStatus==='loading'?'<p class="auth-progress" role="status">GitHub 인증을 진행하고 있습니다.</p><button class="link-button" data-action="cancel-auth">로그인 취소</button>':authStatus==='error'?'<div class="recovery" role="alert"><strong>GitHub에 연결하지 못했습니다.</strong><p>잠시 후 다시 시도하세요. 프로토타입 도구에서 로그인 상태를 성공으로 바꿔 재시도할 수 있습니다.</p></div>':authStatus==='cancelled'?'<p class="auth-message" role="status">로그인을 취소했습니다. 준비되면 다시 시작할 수 있습니다.</p>':''}<p class="notice">이 프로토타입에서는 예시 GitHub 계정 <code>@jiwoo</code>로 연결합니다. 실제 인증 정보는 입력하지 않습니다.</p></section></div>`}
function mypageView(){const name=state.account?.name||'지우';return `<header class="page-title"><div><h1>마이페이지</h1><p>계정과 학습 방향, 기본 제출 저장소를 관리합니다.</p></div></header><div class="profile-layout"><aside class="profile-account"><span class="identity-avatar">${icon('user')}</span><h2>${esc(name)}</h2><p>@jiwoo · GitHub 예시 계정</p><span class="tag">GitHub 연결됨</span><div class="divider"></div><button class="link-button" data-go="history">나의 학습 기록 보기</button></aside><div class="profile-sections"><section class="profile-section"><h2>계정 정보</h2><dl class="profile-definition"><div><dt>로그인 방식</dt><dd>GitHub</dd></div><div><dt>GitHub 계정</dt><dd>@jiwoo</dd></div><div><dt>연결 상태</dt><dd>연결됨 · 프로토타입 시뮬레이션</dd></div></dl><form class="profile-form" id="account-form"><div><label for="display-name">표시 이름</label><input id="display-name" name="name" value="${esc(name)}" maxlength="30" required autocomplete="nickname"><p class="field-help">학습 화면과 계정에 표시할 이름입니다.</p></div><button class="primary" type="submit">이름 저장</button></form></section><section class="profile-section"><h2>학습 방향</h2><p>추천 과제를 고를 때 반영합니다. 진행 중인 과제는 그대로 유지됩니다.</p><form class="profile-form" id="preferences-form">${Object.entries(choices).map(([key,options])=>`<div><label for="profile-${key}">${{purpose:'학습 목적',goal:'관심 분야 · 목표 직무',experience:'현재 경험'}[key]}</label><select name="${key}" id="profile-${key}">${options.map(([value,title])=>`<option value="${value}" ${state.profile[key]===value?'selected':''}>${title}</option>`).join('')}</select></div>`).join('')}<button class="primary" type="submit">학습 방향 저장</button></form></section><section class="profile-section"><h2>기본 제출 저장소</h2><p>새 과제를 시작할 때 자동 입력할 GitHub 저장소입니다. 과제마다 다른 주소를 제출할 수도 있습니다.</p><form class="profile-form" id="default-repo-form" novalidate><div><label for="default-repo">GitHub 저장소 URL</label><input id="default-repo" name="repository" type="url" value="${esc(state.defaultRepo||'')}" placeholder="https://github.com/jiwoo/cs-lab" aria-describedby="default-repo-error"><p class="error" id="default-repo-error" role="alert"></p><p class="field-help">비워서 저장하면 기본 저장소 설정을 해제합니다.</p></div><button class="primary" type="submit">기본 저장소 저장</button></form></section><section class="profile-section"><h2>계정</h2><p>로그아웃해도 이 브라우저의 학습 기록과 작성 중인 내용은 유지됩니다.</p><div class="actions"><button class="secondary" data-action="logout">로그아웃</button><button class="link-button" data-go="history">학습 기록으로 이동</button></div></section><p class="settings-saved" id="settings-saved" role="status">${esc(settingsSaved)}</p></div></div>`}
function previewView(){const t=tasks[previewId],same=state.active?.taskId===previewId;return `<button class="link-button back" data-go="home">학습으로 돌아가기</button><div class="task-layout"><article class="task-document">${meta(t)}<h1>${esc(t.title)}</h1><p>${esc(t.problem)}</p><section class="document-section"><h2>완료 조건</h2><ul class="requirements">${t.requirements.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></section><section class="document-section"><h2>과제 예시</h2><div class="code-panel"><div class="code-file">${esc(t.file)}</div><pre><code>${esc(t.starter)}</code></pre></div></section></article><aside class="preview-side"><h2>${same?'진행 중인 과제':state.active?'과제 미리보기':'이 과제 시작하기'}</h2><p>예상 작업량 ${t.minutes}분. 제출 마감 없이 자신의 속도로 학습합니다.</p><p>지정 브랜치 <code>${esc(t.branch)}</code>에 작업물을 작성합니다.</p>${!state.active?`<button class="primary" data-begin="${previewId}">과제 시작하기</button>`:same?'<button class="primary" data-action="resume">이 과제 이어하기</button>':'<p>다른 과제를 진행 중입니다. 해당 과제를 마친 뒤 새 과제를 시작할 수 있습니다.</p><button class="primary" data-action="resume">진행 중인 과제 이어하기</button>'}<div><button class="link-button" data-go="home">다른 과제 살펴보기</button></div></aside></div>`}
function submissionRecovery(){return `<div class="recovery" role="alert"><strong>${submissionError==='access'?'저장소에 접근할 수 없습니다.':'지정 브랜치를 찾지 못했습니다.'}</strong><p>${submissionError==='access'?'주소가 올바른지, 연결한 GitHub 계정이 저장소에 접근할 수 있는지 확인하세요.':`저장소에 ${esc(tasks[state.active.taskId].branch)} 브랜치를 만들고 작업물을 push한 뒤 다시 확인하세요.`}</p><button class="link-button" type="button" data-action="retry-submission">작업물 다시 확인</button></div>`}
function enhanceChat(){const a=state.active;const blocked=replyLoading||a.pending;const form=document.getElementById('chat-form');if(blocked){form.querySelector('textarea').disabled=true;form.querySelector('button[type=submit]').disabled=true;form.querySelector('[data-action=finish]')?.remove();form.insertAdjacentHTML('beforebegin',replyLoading?'<p class="chat-pending" role="status">작업물과 설명을 살펴보고 있습니다…</p>':'<div class="recovery" role="alert" style="margin:0 23px 18px"><strong>응답을 받지 못했습니다.</strong><p>보낸 설명은 저장되어 있습니다. 같은 메시지를 중복 제출하지 않고 응답만 다시 요청합니다.</p><button class="link-button" data-action="retry-reply">응답 다시 받기</button></div>')}}
function historyRows(){const records=[...state.history].reverse().filter(r=>(historyFilter==='all'||r.outcome===historyFilter)&&tasks[r.taskId].title.toLowerCase().includes(historyQuery.trim().toLowerCase()));return records.length?records.map(r=>`<button class="history-row" data-record="${esc(r.id)}"><span><strong>${esc(tasks[r.taskId].title)}</strong><small>${esc(tasks[r.taskId].concept)} · 대화와 피드백</small></span><time datetime="${esc(r.date)}">${shortDate(r.date)}</time><span class="outcome ${r.outcome==='fail'?'fail':''}">${r.outcome.toUpperCase()}</span></button>`).join(''):`<div class="empty"><h3>조건에 맞는 기록이 없습니다.</h3><p>다른 과제명을 검색하거나 필터를 초기화해 주세요.</p><button class="link-button" data-action="clear-filters">검색 · 필터 초기화</button></div>`}
function enhanceHistory(){if(!state.history.length)return;const list=main.querySelector('.history-list');list.insertAdjacentHTML('beforebegin',`<div class="filter-bar"><div><label for="history-search">과제명 검색</label><input id="history-search" type="search" value="${esc(historyQuery)}" placeholder="과제명 입력" autocomplete="off"></div><div><label for="history-filter">평가 결과</label><select id="history-filter"><option value="all" ${historyFilter==='all'?'selected':''}>전체</option><option value="pass" ${historyFilter==='pass'?'selected':''}>PASS</option><option value="fail" ${historyFilter==='fail'?'selected':''}>FAIL</option></select></div></div><p class="filter-result" id="filter-result" role="status"></p>`);updateHistoryResults()}
function updateHistoryResults(){const list=main.querySelector('.history-list');if(!list)return;list.innerHTML=historyRows();document.getElementById('filter-result').textContent=`검색 결과 ${list.querySelectorAll('.history-row').length}건`}
function authenticate(){if(authStatus==='loading')return;authStatus='loading';render();authTimer=setTimeout(()=>{if(page!=='login')return;if(simulation.login==='error'){authStatus='error';render();document.querySelector('[data-action=authenticate]').focus();return}authStatus='idle';state.signedIn=true;if(!state.account)state.account={name:'지우',handle:'jiwoo'};editing=false;go(state.onboardingComplete?'home':'onboarding')},750)}
function connectRepository(){if(connecting||!state.active)return;capture();submissionError='';if(!validRepo(state.active.repo)){const input=document.getElementById('repo');input.setAttribute('aria-invalid','true');document.getElementById('repo-error').textContent='https://github.com/사용자/저장소 형식으로 입력하세요.';input.focus();return}state.active.repo=state.active.repo.trim();state.repo=state.active.repo;connecting=true;save();render();connectionTimer=setTimeout(()=>{if(page!=='task'||!state.active)return;connecting=false;if(simulation.repository!=='success'){submissionError=simulation.repository;render();document.querySelector('[data-action=retry-submission]').focus();return}state.active.stage='chat';if(!state.active.messages.length)state.active.messages=[{role:'ai',text:tasks[state.active.taskId].prompts[0]}];activity();go('assessment')},650)}
function requestReply(){if(replyLoading||!state.active?.pending)return;replyLoading=true;save();render();replyTimer=setTimeout(()=>{if(page!=='assessment'||!state.active)return;replyLoading=false;if(simulation.reply==='error'){render();document.querySelector('[data-action=retry-reply]').focus();return}const a=state.active;a.turn++;a.messages.push({role:'ai',text:tasks[a.taskId].prompts[a.turn]||'같은 원리를 다른 상황에 적용하면 어떻게 될까요? 아직 설명하기 어려운 부분이나 더 확인하고 싶은 내용을 이야기해 주세요.'});a.pending=false;activity();save();render();const log=document.getElementById('chat-log');log.scrollTop=log.scrollHeight;document.getElementById('answer').focus({preventScroll:true})},700)}
function loadDemo(){state=blank();state.signedIn=true;state.onboardingComplete=true;state.profile={purpose:'career',goal:'backend',experience:'experienced'};state.onboardingStep=2;state.repo='https://github.com/jiwoo/cs-lab';for(const [id,outcome,ago] of [['http','pass',4],['semaphore','fail',1]]){const date=new Date();date.setDate(date.getDate()-ago);state.history.push({...newAttempt(id),stage:'chat',turn:1,messages:[{role:'ai',text:tasks[id].prompts[0]},{role:'user',text:id==='http'?'상태 코드는 처리 결과이고 본문은 실제 콘텐츠입니다.':'자리가 없으면 대기열에서 기다립니다. 자리가 반환되면 다음 요청을 실행합니다.'},{role:'ai',text:tasks[id].prompts[1]}],id:`example-${id}`,date:date.toISOString(),outcome});state.activity.push(day(date))}state.active=newAttempt('semaphore');editing=false;selected=null;go('home',false);toast('예시 학습 기록을 불러왔습니다.')}
document.addEventListener('click',async e=>{
 if(e.target.closest('.skip')){e.preventDefault();main.focus({preventScroll:true});main.scrollIntoView({block:'start',behavior:'instant'});return}
 const route=e.target.closest('[data-go]');if(route){e.preventDefault();settingsSaved='';go(route.dataset.go);return}
 const task=e.target.closest('[data-start]');if(task){previewId=task.dataset.start;go('preview');return}
 const begin=e.target.closest('[data-begin]');if(begin){submissionError='';start(begin.dataset.begin);return}
 const record=e.target.closest('[data-record]');if(record){selected={id:record.dataset.record,fromHistory:true};go('result');return}
 const retry=e.target.closest('[data-retry]');if(retry){const r=state.history.find(x=>x.id===retry.dataset.retry);if(r){submissionError='';start(r.taskId)}return}
 const outcome=e.target.closest('[data-outcome]');if(outcome){finish(outcome.dataset.outcome);return}
 const button=e.target.closest('[data-action]');if(!button)return;
 switch(button.dataset.action){
  case 'login':authStatus='idle';go('login');break;
  case 'authenticate':authenticate();break;
  case 'cancel-auth':clearTimeout(authTimer);authStatus='cancelled';render();document.querySelector('[data-action=authenticate]').focus();break;
  case 'logout':capture();state.signedIn=false;editing=false;authStatus='idle';go('login');break;
  case 'resume':if(state.active){submissionError='';go(state.active.stage==='chat'?'assessment':'task')}break;
  case 'onboard-back':if(editing)editStep=Math.max(0,editStep-1);else state.onboardingStep=Math.max(0,state.onboardingStep-1);go('onboarding');break;
  case 'edit-profile':go('mypage');break;
  case 'cancel-edit':editing=false;go('mypage');break;
  case 'finish':finish('pass');break;
  case 'retry-submission':connectRepository();break;
  case 'retry-reply':requestReply();break;
  case 'clear-filters':historyQuery='';historyFilter='all';render();document.getElementById('history-search')?.focus();break;
  case 'reset':state=blank();editing=false;selected=null;previewId=null;historyQuery='';historyFilter='all';submissionError='';authStatus='idle';Object.assign(simulation,{login:'success',repository:'success',reply:'success'});go('landing',false);break;
  case 'demo':historyQuery='';historyFilter='all';submissionError='';loadDemo();break;
  case 'copy':{const branch=tasks[state.active.taskId].branch;try{await navigator.clipboard.writeText(branch);toast('브랜치명을 복사했습니다.')}catch{toast(`복사할 브랜치: ${branch}`)}break}
 }
});
document.addEventListener('change',e=>{
 if(e.target.matches('[data-simulation]')){simulation[e.target.dataset.simulation]=e.target.value;return}
 if(e.target.id==='history-filter'){historyFilter=e.target.value;updateHistoryResults();return}
 if(page==='onboarding'&&e.target.type==='radio'){const p=editing?editDraft:state.profile;p[e.target.name]=e.target.value;if(!editing)save()}
});
document.addEventListener('input',e=>{
 if(e.target.id==='history-search'){historyQuery=e.target.value;updateHistoryResults();return}
 if(e.target.id==='repo'&&state.active){state.active.repo=e.target.value;e.target.removeAttribute('aria-invalid');document.getElementById('repo-error').textContent='';save()}
 if(e.target.id==='answer'&&state.active){state.active.draft=e.target.value;save()}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='onboarding-form'){e.preventDefault();const s=editing?editStep:state.onboardingStep,key=['purpose','goal','experience'][s],value=new FormData(e.target).get(key);if(!choices[key].some(c=>c[0]===value))return;const p=editing?editDraft:state.profile;p[key]=value;if(s<2){if(editing)editStep++;else state.onboardingStep++;go('onboarding')}else if(validProfile(p)){state.profile={...p};state.onboardingComplete=true;state.onboardingStep=2;editing=false;go('home')}return}
 if(e.target.id==='submit-form'){e.preventDefault();connectRepository();return}
 if(e.target.id==='chat-form'){e.preventDefault();if(replyLoading||state.active.pending)return;capture();const a=state.active,text=a.draft.trim();if(!text)return;a.messages.push({role:'user',text});a.draft='';a.pending=true;requestReply();return}
 if(['account-form','preferences-form','default-repo-form'].includes(e.target.id)){
  e.preventDefault();const data=new FormData(e.target);
  if(e.target.id==='account-form'){const name=String(data.get('name')).trim();if(!name){document.getElementById('display-name').setCustomValidity('표시 이름을 입력하세요.');document.getElementById('display-name').reportValidity();return}state.account.name=name;settingsSaved='표시 이름을 저장했습니다.'}
  if(e.target.id==='preferences-form'){const p=Object.fromEntries(data);if(!validProfile(p))return;state.profile=p;settingsSaved='학습 방향을 저장했습니다. 다음 과제 추천에 반영합니다.'}
  if(e.target.id==='default-repo-form'){const repo=String(data.get('repository')).trim();if(repo&&!validRepo(repo)){const input=document.getElementById('default-repo');input.setAttribute('aria-invalid','true');document.getElementById('default-repo-error').textContent='https://github.com/사용자/저장소 형식으로 입력하세요.';input.focus();return}state.defaultRepo=repo;settingsSaved=repo?'기본 제출 저장소를 저장했습니다.':'기본 제출 저장소 설정을 해제했습니다.'}
  savedForm=e.target.id;save();render();document.getElementById('settings-saved').setAttribute('tabindex','-1');document.getElementById('settings-saved').focus({preventScroll:true});
 }
});
document.addEventListener('input',e=>{if(e.target.id==='display-name')e.target.setCustomValidity('');if(e.target.id==='default-repo'){e.target.removeAttribute('aria-invalid');document.getElementById('default-repo-error').textContent=''}});
window.addEventListener('popstate',()=>readRoute(true));
readRoute(true);
</script>
</body>
</html>
