<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="관심 분야와 경험에 맞는 작은 과제로 CS와 개발을 배우는 smallbyte 프로토타입">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23272c25'/%3E%3Cpath d='M21 10H13a4 4 0 0 0 0 8h6a2 2 0 0 1 0 4H10' fill='none' stroke='%23f6f6f0' stroke-width='3'/%3E%3C/svg%3E">
  <title>smallbyte</title>
  <style>
    :root { --bg:#fafaf7; --ink:#272c25; --muted:#63695e; --line:#dce0d5; --accent:#496331; --tint:#edf0e5; --error:#a0372e; --white:#fff; color-scheme:light; }
    * { box-sizing:border-box; scrollbar-width:thin; scrollbar-color:#bbc2b2 var(--bg); }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased; }
    ::selection { background:#dce6cb; color:var(--ink); }
    button, input, textarea, select { font:inherit; color:inherit; }
    button, a, summary { -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    button { cursor:pointer; }
    button:disabled { cursor:wait; opacity:.6; }
    button, a, input, textarea, select, summary { outline-offset:4px; }
    :focus-visible { outline:2px solid var(--accent); }
    a { color:inherit; text-underline-offset:5px; }
    button { border:0; background:none; }
    input, textarea { caret-color:var(--accent); }
    h1, h2, h3, p { margin:0; }
    h1, h2, h3 { line-height:1.4; text-wrap:balance; letter-spacing:-.025em; }
    h1 { font-size:32px; font-weight:650; }
    h2 { font-size:18px; font-weight:650; }
    h3 { font-size:15px; font-weight:600; }
    p, li { word-break:keep-all; overflow-wrap:anywhere; }
    svg { width:18px; height:18px; vertical-align:middle; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    code, pre { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px; }
    code { background:var(--tint); padding:2px 5px; border-radius:2px; overflow-wrap:anywhere; }
    pre { padding:18px 20px; margin:0; line-height:1.95; overflow:auto; tab-size:2; }
    pre code { padding:0; background:none; border-radius:0; overflow-wrap:normal; }
    .site-header { max-width:1064px; margin:auto; padding:24px 32px; display:flex; align-items:center; gap:65px; border-bottom:1px solid var(--line); }
    .brand { font-size:23px; font-weight:780; letter-spacing:-1px; text-decoration:none; line-height:1.4; }
    .brand span { color:var(--accent); }
    .site-nav { display:flex; gap:30px; align-items:center; }
    .site-nav a { font-size:13px; text-decoration:none; color:var(--muted); padding:5px 0; }
    .site-nav a:hover { color:var(--ink); }
    .site-nav a[aria-current=page] { color:var(--ink); text-decoration:underline; text-decoration-color:var(--accent); text-decoration-thickness:2px; text-underline-offset:10px; }
    .prototype-label { margin-left:auto; color:var(--muted); font-size:11px; }
    main { max-width:792px; padding:55px 32px 0; margin:auto; min-height:520px; }
    main:focus { outline:none; }
    main[data-page=login] { max-width:792px; padding-top:95px; }
    main[data-page=onboarding] { max-width:624px; padding-top:56px; }
    main[data-page=assessment] { max-width:1016px; }
    .site-footer { max-width:792px; margin:78px auto 0; padding:20px 32px 30px; color:var(--muted); font-size:11px; }
    .footer-line { border-top:1px solid var(--line); padding-top:17px; display:flex; justify-content:space-between; align-items:baseline; gap:18px; }
    .footer-links { display:flex; gap:17px; flex-shrink:0; }
    .footer-links button { padding:0; font-size:11px; color:var(--muted); text-decoration:underline; text-underline-offset:4px; }
    .prototype-tools { margin-top:14px; max-width:650px; }
    .prototype-tools summary { cursor:pointer; display:list-item; list-style-position:inside; width:fit-content; }
    .tool-actions { display:flex; gap:16px; flex-wrap:wrap; align-items:center; padding:12px 0 0; }
    .tool-actions button { padding:2px 0; font-size:11px; text-decoration:underline; text-underline-offset:4px; }
    .tool-note { margin-top:8px; font-size:11px; }
    .primary, .secondary { display:inline-flex; justify-content:center; align-items:center; gap:9px; padding:10px 18px; min-height:44px; border:1px solid var(--ink); border-radius:3px; font-size:13px; font-weight:550; line-height:1.6; }
    .primary { background:var(--ink); color:var(--white); }
    .primary:hover { background:#41483a; border-color:#41483a; }

    .back { margin-bottom:25px; display:inline-block; }
    .intro { color:var(--muted); margin-top:15px; max-width:58ch; font-size:14px; line-height:1.95; }
    .login-title { font-size:39px; line-height:1.45; letter-spacing:-.035em; }
    .login-copy { font-size:15px; color:var(--muted); line-height:2; margin-top:23px; max-width:48ch; }
    .login-action { margin-top:33px; }

    .form-fields { display:grid; gap:27px; margin-top:32px; }
    .field label { display:block; font-size:13px; font-weight:550; margin-bottom:9px; }
    .field select, .field input { width:100%; padding:11px 12px; min-height:46px; background:var(--white); border:1px solid #aeb7a2; border-radius:3px; font-size:14px; }
    select { cursor:pointer; }
    .form-actions { margin-top:32px; display:flex; gap:24px; align-items:center; }
    .error { font-size:12px; color:var(--error); margin-top:8px; }

    .task-meta .in-progress { color:var(--accent); }
    .home-task { max-width:670px; }
    .home-task h1 { max-width:590px; }
    .home-description { font-size:15px; color:var(--muted); line-height:1.95; margin-top:25px; max-width:58ch; }
    .recommendation-reason { font-size:12px; color:var(--muted); margin-top:21px; max-width:65ch; }
    .home-actions { margin-top:29px; display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
    .catalog { margin-top:35px; border-top:1px solid var(--line); padding-top:6px; }
    .catalog-row { width:100%; display:flex; align-items:center; justify-content:space-between; text-align:left; gap:24px; border-bottom:1px solid var(--line); padding:17px 0; font-size:13px; }
    .catalog-row:hover strong { text-decoration:underline; text-underline-offset:5px; }

    .catalog-row small { display:block; font-size:11px; color:var(--muted); margin-top:3px; }
    .catalog-row>span:last-child { color:var(--muted); font-size:12px; white-space:nowrap; }
    .task-description { margin-top:29px; max-width:68ch; }
    .task-section { margin-top:33px; }
    .task-section h2 { font-size:16px; margin-bottom:12px; }
    .task-section p, .task-section li { font-size:14px; line-height:1.95; }
    .requirements { padding-left:19px; margin:0; display:grid; gap:8px; }
    .branch-line { display:flex; align-items:center; gap:15px; flex-wrap:wrap; margin-top:24px; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .branch-line>span { font-size:12px; color:var(--muted); }
    .branch-line code { background:transparent; padding:0; }
    .copy-button { padding:3px; display:grid; place-items:center; min-width:30px; min-height:30px; border-radius:3px; color:var(--muted); }
    .copy-button:hover { background:var(--tint); }
    .copy-button svg { width:15px; height:15px; }
    .starter { margin-top:24px; }
    .starter summary, .source summary { font-size:12px; color:var(--muted); cursor:pointer; width:fit-content; list-style-position:inside; }
    .code-example { margin-top:13px; background:#f0f2eb; border:1px solid var(--line); border-radius:3px; overflow:hidden; }
    .file-name { padding:8px 15px; font-size:11px; border-bottom:1px solid var(--line); color:var(--muted); }
    .task-note { font-size:12px!important; color:var(--muted); margin-top:12px; }
    .submission { margin-top:36px; padding-top:25px; border-top:1px solid var(--ink); }
    .submission label { display:block; font-size:13px; font-weight:550; margin-bottom:10px; }
    .submission-row { display:flex; gap:10px; align-items:stretch; }
    .submission-row input { min-width:0; flex:1; background:var(--white); border:1px solid #aeb7a2; border-radius:3px; padding:11px 12px; font-size:13px; }
    .submission-row button { flex-shrink:0; }
    input::placeholder, textarea::placeholder { color:#6b7263; opacity:1; }
    .form-help { color:var(--muted); font-size:11px; margin-top:11px; }
    .connecting { font-size:12px; color:var(--accent); margin-top:12px; }
    .connecting:empty { display:none; }
    .assessment-heading { margin-bottom:26px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .assessment-heading h1 { font-size:25px; }
    .stage { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; white-space:nowrap; }
    .stage svg { width:18px; height:18px; stroke-width:2; transform:rotate(-90deg); }
    .ring-track { stroke:var(--line); }
    .ring-fill { stroke:var(--accent); stroke-dasharray:50.27; stroke-dashoffset:var(--offset); }
    .source { border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:12px 0; margin-bottom:29px; }
    .source-body { padding:17px 0 7px; }
    .source-meta { display:flex; gap:22px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
    .source-meta code { background:none; padding:0; }
    .source .code-example pre { max-height:340px; }
    .chat-layout { display:grid; grid-template-columns:minmax(0,1fr); }
    .chat-layout.with-source { grid-template-columns:300px minmax(0,1fr); gap:32px; }
    .chat-layout.with-source .source { margin:0; border-bottom:0; }
    .chat-layout.with-source .source summary { font-size:12px; }
    .chat-layout.with-source .source-meta { display:grid; gap:10px; }
    .chat-layout.with-source .conversation { border-left:1px solid var(--line); padding-left:31px; min-width:0; }
    .conversation { max-width:700px; width:100%; }
    .chat-log { display:grid; gap:29px; padding:4px 8px 28px 0; max-height:470px; min-height:150px; overflow:auto; scrollbar-gutter:stable; scroll-behavior:smooth; }
    .message-author { font-size:11px; color:var(--muted); margin-bottom:9px; }
    .message-text { font-size:14px; line-height:1.95; white-space:pre-wrap; overflow-wrap:anywhere; }
    .message.user { padding-left:16px; border-left:1px solid #b8c3a9; }
    .chat-form { padding-top:21px; border-top:1px solid var(--line); }
    .chat-form label { display:block; font-size:12px; margin-bottom:10px; }
    .chat-form textarea { display:block; resize:vertical; min-height:112px; max-height:300px; width:100%; padding:12px; border:1px solid #aeb7a2; border-radius:3px; background:var(--white); font-size:13px; line-height:1.9; }
    .chat-actions { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-top:12px; }
    .chat-actions .primary { margin-left:auto; font-size:12px; min-height:40px; padding:8px 16px; }
    .chat-actions .text-button { font-size:11px; text-align:left; }
    .result-title { font-size:27px; }
    .result-status { display:flex; align-items:baseline; gap:12px; margin-top:24px; }
    .result-status strong { color:var(--accent); font-size:17px; letter-spacing:.02em; }
    .result-status.fail strong { color:var(--error); }
    .result-status span { font-size:11px; color:var(--muted); }
    .result-summary { font-size:15px; margin-top:10px; }
    .feedback-sections { margin-top:29px; display:grid; gap:27px; }
    .feedback-sections h2 { font-size:15px; margin-bottom:10px; }
    .feedback-sections p { font-size:14px; line-height:1.95; color:var(--muted); max-width:66ch; }
    .result-actions { margin-top:32px; padding-top:25px; border-top:1px solid var(--line); display:flex; gap:23px; flex-wrap:wrap; align-items:center; }
    .transcript { margin-top:26px; }
    .transcript .chat-log { max-height:none; margin-top:20px; padding:0; }
    .transcript>summary { cursor:pointer; font-size:12px; width:fit-content; list-style-position:inside; }
    .history-activity { margin-top:28px; padding-bottom:27px; border-bottom:1px solid var(--line); }
    .heatmap { display:grid; grid-template-rows:repeat(7,11px); grid-template-columns:repeat(20,11px); grid-auto-flow:column; gap:3px; width:fit-content; }
    .heat-cell { background:#e8ecdf; border:1px solid #dfe4d6; border-radius:1px; }
    .heat-cell[data-level="1"] { background:#b7c89f; border-color:#b7c89f; }
    .heat-cell[data-level="2"] { background:#7d9a5d; border-color:#7d9a5d; }
    .heat-cell[data-level="3"] { background:#496331; border-color:#496331; }
    .heat-cell.future { visibility:hidden; }
    .activity-dates { display:flex; justify-content:space-between; max-width:277px; color:var(--muted); font-size:11px; margin-top:10px; }
    .history-list { margin-top:10px; }
    .history-row { display:grid; grid-template-columns:minmax(0,1fr) 95px 45px; align-items:center; gap:20px; text-align:left; width:100%; border-bottom:1px solid var(--line); padding:19px 0; font-size:13px; }
    .history-row:hover .history-title { text-decoration:underline; text-underline-offset:5px; }
    .history-row time { color:var(--muted); font-size:11px; }
    .history-status { text-align:right; font-size:11px; color:var(--accent); font-weight:600; }
    .history-status.fail { color:var(--error); }
    .empty { padding:31px 0 0; font-size:14px; color:var(--muted); }
    .empty-action { margin-top:20px; }
    .notice { margin-top:14px; font-size:12px; color:var(--muted); }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--white); font-size:12px; border-radius:3px; padding:10px 17px; max-width:calc(100vw - 32px); box-shadow:0 5px 18px #2222; z-index:10; }
    .toast:empty { display:none; }
    .skip { position:absolute; left:20px; top:-100px; z-index:20; background:var(--white); padding:10px; }
    .skip:focus { top:10px; }
    @media(min-width:1100px) {
      main[data-page=home] { padding-top:77px; }
      main[data-page=home] h1 { font-size:35px; }
      main[data-page=assessment]:has(.with-source) { max-width:1064px; }
    }
    @media(max-width:760px) {
      .site-header { margin:0 24px; padding:20px 0; gap:35px; }
      main { padding:36px 24px 0; }
      .site-footer { padding-left:24px; padding-right:24px; margin-top:55px; }
      .chat-layout.with-source { display:flex; flex-direction:column; gap:25px; }
      .chat-layout.with-source .conversation { padding-left:0; border-left:0; }
      .chat-layout.with-source .source { border-bottom:1px solid var(--line); padding:12px 0; }
      .chat-layout.with-source .source-meta { display:flex; }
      .assessment-heading h1 { font-size:24px; }
      .source .code-example pre { max-height:220px; }
    }
    @media(max-width:480px) {
      .site-header { margin:0 21px; padding:18px 0; gap:28px; flex-wrap:wrap; }
      .brand { font-size:22px; }
      .site-nav { gap:22px; }
      .site-nav a { font-size:12px; }
      .prototype-label { font-size:11px; }
      main { padding:33px 21px 0; min-height:440px; }
      main[data-page=login] { padding-top:64px; min-height:390px; }
      main[data-page=onboarding] { padding-top:35px; }
      h1 { font-size:27px; }
      .login-title { font-size:32px; }
      .login-copy { font-size:13px; line-height:1.95; }
      .intro { font-size:13px; }
      .home-description { font-size:14px; margin-top:22px; }
      .recommendation-reason { margin-top:18px; }
      .home-actions { gap:21px; }
      .task-meta { gap:5px 13px; font-size:11px; }
      .task-section { margin-top:28px; }
      .task-section p, .task-section li { font-size:13px; }
      .branch-line { gap:10px; }
      .branch-line code { font-size:11px; }
      .submission-row { flex-wrap:wrap; gap:12px; }
      .submission-row input { flex-basis:100%; }
      .assessment-heading { align-items:flex-start; gap:12px; }
      .assessment-heading h1 { font-size:23px; }
      .stage { margin-top:6px; font-size:11px; }
      .stage svg { width:16px; height:16px; }
      .source { margin-bottom:25px; }
      .message-text { font-size:13px; }
      .chat-log { max-height:430px; gap:25px; }
      .chat-actions { gap:15px; }
      .chat-actions .text-button { max-width:165px; }
      .chat-actions .primary { flex-shrink:0; }
      .result-title { font-size:25px; }
      .feedback-sections p { font-size:13px; }
      .history-row { grid-template-columns:minmax(0,1fr) 64px 36px; gap:12px; padding:17px 0; font-size:12px; }
      .history-row time { font-size:11px; }
      .site-footer { padding:18px 21px 25px; margin-top:48px; }
      .footer-line { flex-wrap:wrap; gap:12px; }
      .footer-links { gap:20px; }
      pre { font-size:11px; padding:16px; }
    }
    @media(prefers-reduced-motion:reduce) { html, .chat-log { scroll-behavior:auto; } }
  </style>
</head>

  <header class="site-header" id="header"></header>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    'use strict';
    const STORAGE_KEY = 'smallbyte-prototype-v1';
    const purposes = { explore:'호기심과 관심 분야 탐색', basics:'CS·개발 기초 다지기', career:'취업·직무 전환 준비', school:'학교 공부에 연결', work:'실무 지식 보완' };
    const goals = { undecided:'아직 탐색 중이에요', cs:'컴퓨터 과학 기초', backend:'백엔드 개발', frontend:'프론트엔드 개발', reliability:'서비스 운영·안정성' };
    const experiences = { beginner:'이제 시작해요', basic:'기초 코드를 읽고 작성할 수 있어요', experienced:'프로젝트를 만들어 본 경험이 있어요' };
    const tasks = {
      stack: {
        title:'함수 호출을 스택으로 따라가기', concept:'콜 스택', minutes:25, language:'코드 작성 없이', branch:'smallbyte/call-stack', file:'README.md',
        description:'함수가 다른 함수를 호출할 때, 무엇이 먼저 끝날까요? 호출 스택의 변화를 직접 그려 봅니다.',
        problem:'아래 코드는 greet()에서 getName()을 호출합니다. 각 함수가 호출되고 끝날 때 스택에 무엇이 남아 있는지 기록하세요. 코드를 실행하지 않고 먼저 예상한 뒤, 실행 결과와 비교합니다.',
        requirements:['함수가 호출될 때마다 스택에 추가되는 함수 이름을 순서대로 기록하세요.','함수가 반환될 때 스택에서 무엇이 제거되는지 표시하세요.','마지막에 콘솔에 출력되는 값과 그 이유를 README.md에 설명하세요.'],
        starter:'function getName() {\n  return "smallbyte";\n}\n\nfunction greet() {\n  const name = getName();\n  return "Hello, " + name;\n}\n\nconsole.log(greet());',
        sample:'greet 호출 → getName 호출\ngetName 반환 → greet 반환 → console.log 호출\n\n출력: Hello, smallbyte\n함수 인자를 계산한 뒤 console.log가 호출됩니다.',
        prompts:['greet()가 getName()을 호출한 순간, greet()는 어디에 있나요? 작성한 스택 기록으로 설명해 주세요.','getName()이 끝나면 왜 greet()로 돌아가나요? 스택에서 제거되는 것과 남는 것을 구분해 주세요.','getName()이 자기 자신을 계속 호출하고 반환하지 않는다면 어떤 일이 생길까요?'],

      semaphore: {
        title:'세마포어로 요청 제어하기', concept:'세마포어', minutes:60, language:'JavaScript', branch:'smallbyte/semaphore', file:'src/semaphore.js',
        description:'동시에 실행되는 요청을 3개로 제한합니다. 자리가 생겼을 때 대기 중인 요청을 실행하는 작은 세마포어를 만듭니다.',
        problem:'10개의 이미지 변환 작업을 처리하려고 합니다. API는 동시에 3개까지만 처리할 수 있습니다. 모든 요청을 한꺼번에 실행하지 않고, 실행 가능한 자리가 생기면 다음 작업을 시작하도록 구현하세요.',
        requirements:['허용 개수를 받는 Semaphore 클래스와 acquire(), release()를 구현하세요.','10개 작업을 실행해 동시에 실행되는 작업이 3개를 넘지 않도록 하세요.','작업이 실패해도 자리를 반환하고, 대기 중인 작업이 계속 실행되는지 테스트하세요.'],
        starter:'const semaphore = new Semaphore(3);\n\nasync function runTask(task) {\n  await semaphore.acquire();\n  try {\n    return await task();\n  } finally {\n    semaphore.release();\n  }\n}',
        sample:'async acquire() {\n  if (this.active < this.limit) {\n    this.active++;\n    return;\n  }\n  await new Promise(resolve => {\n    this.queue.push(resolve);\n  });\n}\n\nrelease() {\n  const next = this.queue.shift();\n  if (next) next();\n  else this.active--;\n}',
        prompts:['이미 3개의 요청이 실행 중일 때 acquire()를 호출하면, 네 번째 요청은 어떻게 되나요? 작성한 코드의 흐름을 따라 설명해 주세요.','release()에서 대기 요청을 깨울 때 active 값은 어떻게 관리하나요? 새 요청이 그 사이에 들어오는 경우도 생각해 주세요.','작업이 실패했을 때 release()를 호출하지 않으면 나머지 요청은 어떻게 되나요? finally를 사용한 이유를 설명해 주세요.','허용 개수를 1로 설정한 세마포어와 뮤텍스는 어떤 공통점과 차이가 있을까요?'],
        understood:'동시 실행 수를 제한하는 원리와 대기열의 역할을 설명했습니다. finally에서 자원을 반환해 오류가 나도 다음 요청을 처리하도록 한 점도 좋습니다.',
        improve:'대기 요청을 깨울 때 실행 자리가 누구에게 전달되는지 살펴보세요. 새 요청이 대기 중인 요청을 앞지르는 상황을 테스트하면 더 견고해집니다.',
        retry:'허용 개수 1, 대기 요청 2개인 상황을 그려 보세요. 각 단계의 active 값과 queue를 적고, 실행 자리가 중복으로 할당되지 않는지 테스트한 뒤 다시 설명해 주세요.',
        next:'공유 자원에 하나의 작업만 접근하도록 하는 뮤텍스를 살펴보세요. 동시 실행 수의 제한과 자원에 대한 소유권을 비교해 볼 수 있습니다.'
      }
    };
    const icons = {
      github:'<path d="M9 20c-5 1-5-2-7-2m14 4v-4a3.5 3.5 0 0 0-1-3c3-.3 6-1.5 6-6a5 5 0 0 0-1-3.5A5 5 0 0 0 20 2s-1.5-.5-4 1a14 14 0 0 0-8 0C5.5 1.5 4 2 4 2a5 5 0 0 0 0 3.5A5 5 0 0 0 3 9c0 4.5 3 5.7 6 6a3.5 3.5 0 0 0-1 3v4"/>',
      copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>'
    };
    const svg = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name] || ''}</svg>`;
    const html = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const owns = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
    const freshState = () => ({ version:1, signedIn:false, profile:null, active:null, repo:'', history:[], activity:[] });
    const main = document.getElementById('main');
    let storageFailed = false;
    function validProfile(profile) {
      return profile && owns(purposes, profile.purpose) && owns(goals, profile.goal) && owns(experiences, profile.experience);
    }
    function validAttempt(attempt) {
      return attempt && owns(tasks, attempt.taskId) && typeof attempt.repo === 'string' && typeof attempt.draft === 'string' && Array.isArray(attempt.messages) && attempt.messages.every(message => message && ['ai','user'].includes(message.role) && typeof message.text === 'string') && Number.isInteger(attempt.turn) && attempt.turn >= 0 && ['task','chat'].includes(attempt.stage);
    }
    function readState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved || saved.version !== 1 || typeof saved.signedIn !== 'boolean' || (saved.profile !== null && !validProfile(saved.profile)) || (saved.active !== null && !validAttempt(saved.active)) || typeof saved.repo !== 'string' || !Array.isArray(saved.history) || !saved.history.every(record => validAttempt(record) && typeof record.id === 'string' && ['pass','fail'].includes(record.outcome) && typeof record.date === 'string' && !Number.isNaN(Date.parse(record.date))) || !Array.isArray(saved.activity) || !saved.activity.every(day => typeof day === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(day))) return freshState();
        return saved;
      } catch { return freshState(); }
    }
    let state = readState();
    let page = !state.signedIn ? 'login' : !state.profile ? 'onboarding' : 'home';
    let selectedTask = null;
    let selectedRecord = null;
    let showCatalog = false;
    let profileDraft = state.profile ? {...state.profile} : {purpose:'',goal:'',experience:''};
    let connecting = false;
    let sourceOpen = false;
    let connectionTimer;
    let toastTimer;
    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); storageFailed = false; }
      catch { storageFailed = true; }
      const status = document.getElementById('storage-status');
      if (status) status.textContent = storageFailed ? '이 브라우저에 저장할 수 없습니다. 이 탭을 열어 둔 동안은 계속할 수 있습니다.' : '';
    }
    function localDay(value = new Date()) {
      const date = new Date(value);
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }
    function markActivity() { state.activity.push(localDay()); }
    function capture() {
      const repo = document.getElementById('repo');
      const answer = document.getElementById('answer');
      if (repo && state.active) state.active.repo = repo.value;
      if (answer && state.active) state.active.draft = answer.value;
      if (page === 'onboarding') for (const key of ['purpose','goal','experience']) {
        const input = document.getElementById(key);
        if (input) profileDraft[key] = input.value;
      }
    }
    function go(next, captureCurrent = true) {
      if (captureCurrent) capture();
      clearTimeout(connectionTimer);
      connecting = false;
      page = next;
      save();
      render();
      window.scrollTo({top:0,behavior:'instant'});
      main.focus({preventScroll:true});
    }
    function notify(text) {
      clearTimeout(toastTimer);
      document.getElementById('toast').textContent = text;
      toastTimer = setTimeout(() => document.getElementById('toast').textContent = '', 3500);
    }
    function meta(task, active = false) {
      return `<div class="task-meta">${active ? '<span class="in-progress">진행 중</span>' : ''}<span>${html(task.concept)}</span><span>${html(task.language)}</span><span>예상 ${task.minutes}분</span></div>`;
    }
    function recommendation() {
      const passed = new Set(state.history.filter(record => record.outcome === 'pass').map(record => record.taskId));
      const profile = state.profile;
      let order;
      if (profile.experience === 'beginner') order = ['stack','http','dom','semaphore'];
      else if (profile.goal === 'frontend') order = ['dom','http','stack','semaphore'];
      else if (profile.goal === 'cs' || profile.purpose === 'school') order = ['stack','http','semaphore','dom'];
      else if (profile.experience === 'experienced' && ['backend','reliability'].includes(profile.goal)) order = ['semaphore','http','stack','dom'];
      else order = ['http','stack','dom','semaphore'];
      return order.find(id => !passed.has(id)) || null;
    }
    function reason(taskId) {
      const profile = state.profile;
      if (profile.experience === 'beginner' && taskId === 'stack') return '처음 시작하는 단계에 맞춰, 코드 작성 없이 실행 순서부터 살펴보는 과제입니다.';
      if (profile.goal === 'frontend' && taskId === 'dom') return '프론트엔드에 관심이 있고 기초 코드 경험이 있어, 브라우저에서 직접 동작을 만드는 과제를 추천합니다.';
      if (['backend','reliability'].includes(profile.goal) && taskId === 'semaphore') return '백엔드·서비스 안정성에 대한 관심과 프로젝트 경험을 바탕으로 추천합니다.';
      if ((profile.goal === 'cs' || profile.purpose === 'school') && taskId === 'stack') return 'CS 기초를 이해하는 데 필요한 함수 실행 순서부터 살펴봅니다.';
      if (profile.goal === 'undecided') return '관심 분야를 탐색할 수 있도록, 현재 경험에 맞는 기초 과제를 추천합니다.';
      return `${goals[profile.goal]}에 대한 관심과 현재 경험에 맞춰 추천합니다.`;
    }
    function render() {
      const ready = state.signedIn && state.profile;
      document.getElementById('header').innerHTML = `<a class="brand" href="#" data-go="${ready ? 'home' : state.signedIn ? 'onboarding' : 'login'}" aria-label="smallbyte 홈">smallbyte<span>.</span></a>${ready ? `<nav class="site-nav" aria-label="주요 메뉴"><a href="#learn" data-go="home" ${!['history'].includes(page) && !(page === 'result' && selectedRecord?.fromHistory) ? 'aria-current="page"' : ''}>학습</a><a href="#history" data-go="history" ${page === 'history' || (page === 'result' && selectedRecord?.fromHistory) ? 'aria-current="page"' : ''}>기록</a></nav>` : ''}<span class="prototype-label">프로토타입</span>`;
      main.dataset.page = page;
      const screens = {login:loginView,onboarding:onboardingView,home:homeView,task:taskView,assessment:assessmentView,result:resultView,history:historyView};
      main.innerHTML = screens[page]();
      document.title = `${{login:'시작하기',onboarding:'학습 방향',home:'학습',task:'과제',assessment:'이해도 확인',result:'피드백',history:'학습 기록'}[page]} · smallbyte`;
      document.getElementById('footer').innerHTML = `<div class="footer-line"><span>로그인·GitHub 연결·AI 평가는 예시로 동작합니다.</span>${ready ? '<div class="footer-links"><button data-action="edit-profile">학습 방향 수정</button><button data-action="logout">로그아웃</button></div>' : ''}</div><details class="prototype-tools"><summary>프로토타입 도구</summary><div class="tool-actions"><button data-action="demo">예시 학습자 불러오기</button>${page === 'assessment' ? '<button data-outcome="pass">PASS 결과 보기</button><button data-outcome="fail">FAIL 결과 보기</button>' : ''}<button data-action="reset">초기화하고 처음부터</button></div><p class="tool-note">데이터는 이 브라우저에 저장됩니다. 예시 학습자 불러오기와 초기화는 현재 체험 데이터를 바꿉니다.</p></details><p id="storage-status" class="notice" role="status">${storageFailed ? '이 브라우저에 저장할 수 없습니다. 이 탭을 열어 둔 동안은 계속할 수 있습니다.' : ''}</p>`;
      const source = main.querySelector('.source');

    }
    function loginView() {
      return `<h1 class="login-title">만들면서 배우는<br>CS와 개발.</h1><p class="login-copy">관심 분야와 경험에 맞는 작은 과제부터 시작하세요.<br>작업을 마치면 코드에 관해 대화하고 피드백을 받습니다.</p><div class="login-action"><button class="primary" data-action="login">${svg('github')}GitHub로 시작하기</button></div>`;
    }
    function selectField(id, label, options) {
      return `<div class="field"><label for="${id}">${label}</label><select id="${id}" name="${id}" required><option value="" disabled ${!profileDraft[id] ? 'selected' : ''}>선택해 주세요</option>${Object.entries(options).map(([value,text]) => `<option value="${value}" ${profileDraft[id] === value ? 'selected' : ''}>${html(text)}</option>`).join('')}</select></div>`;
    }
    function onboardingView() {
      return `<h1>어디서부터 시작할까요?</h1><p class="intro">지금의 관심과 경험에 맞는 과제를 고릅니다.<br>정해진 진로가 없어도 괜찮습니다.</p><form id="profile-form"><div class="form-fields">${selectField('purpose','배우려는 이유',purposes)}${selectField('goal','관심 분야 또는 목표 직무',goals)}${selectField('experience','현재 경험',experiences)}</div><div class="form-actions"><button class="primary" type="submit">${state.profile ? '저장하기' : '과제 추천받기'}</button>${state.profile ? '<button class="text-button" type="button" data-go="home">취소</button>' : ''}</div></form>`;
    }
    function homeView() {
      const active = state.active;
      const taskId = active?.taskId || selectedTask || recommendation();
      if (!taskId) return `<h1>준비된 과제를 모두 마쳤습니다.</h1><p class="intro">학습 기록에서 피드백을 다시 읽거나, 과제를 다시 수행할 수 있습니다.</p><div class="home-actions"><button class="primary" data-go="history">학습 기록 보기</button><button class="text-button" data-action="catalog">과제 다시 살펴보기</button></div>${showCatalog ? catalogView() : ''}`;
      const task = tasks[taskId];
      return `<article class="home-task"><h1>${html(task.title)}</h1>${meta(task,Boolean(active))}<p class="home-description">${html(task.description)}</p>${!active && !selectedTask ? `<p class="recommendation-reason">${html(reason(taskId))}</p>` : ''}<div class="home-actions"><button class="primary" ${active ? 'data-action="resume"' : `data-start="${taskId}"`}>${active ? active.stage === 'chat' ? '대화 이어가기' : '과제 이어하기' : '과제 시작하기'}</button>${!active ? `<button class="text-button" data-action="catalog" aria-expanded="${showCatalog}" aria-controls="catalog">${showCatalog ? '다른 과제 접기' : '다른 과제 보기'}</button>` : ''}</div></article>${showCatalog && !active ? catalogView() : ''}`;
    }
    function catalogView() {
      return `<section class="catalog" id="catalog" aria-label="미리 준비된 과제">${Object.entries(tasks).map(([id,task]) => `<button class="catalog-row" data-choose="${id}"><span><strong>${html(task.title)}</strong><small>${html(task.concept)} · ${html(task.language)}</small></span><span>${task.minutes}분</span></button>`).join('')}</section>`;
    }
    function taskView() {
      const active = state.active;
      const task = tasks[active.taskId];
      return `<button class="text-button back" data-go="home">학습으로 돌아가기</button><article><h1>${html(task.title)}</h1>${meta(task)}<p class="task-description">${html(task.problem)}</p><section class="task-section"><h2>완료 조건</h2><ul class="requirements">${task.requirements.map(item => `<li>${html(item)}</li>`).join('')}</ul></section><div class="branch-line"><span>작업 브랜치</span><code>${html(task.branch)}</code><button class="copy-button" data-action="copy-branch" aria-label="브랜치명 복사">${svg('copy')}</button></div><p class="task-note">저장소에 이 브랜치를 만들고 작업물을 push하세요.${task.language === '코드 작성 없이' ? ' GitHub에서 README.md를 직접 작성해도 됩니다.' : ''}</p><details class="starter"><summary>${task.language === '코드 작성 없이' ? '문제 예시 보기' : '시작 코드 보기'}</summary><div class="code-example"><pre><code>${html(task.starter)}</code></pre></div></details><form class="submission" id="submit-form" novalidate><label for="repo">작업한 GitHub 저장소</label><div class="submission-row"><input id="repo" name="repo" type="url" value="${html(active.repo)}" placeholder="https://github.com/username/cs-lab" autocomplete="url" aria-describedby="repo-help repo-error" required ${connecting ? 'disabled' : ''}><button class="primary" type="submit" ${connecting ? 'disabled' : ''}>${connecting ? '연결 중…' : '제출하고 대화하기'}</button></div><p class="form-help" id="repo-help">지정 브랜치의 작업물을 찾습니다. 파일 업로드나 경로 지정은 필요 없습니다.</p><p class="error" id="repo-error" role="alert"></p><p class="connecting" role="status">${connecting ? '저장소 연결 과정을 예시로 진행하고 있습니다.' : ''}</p></form></article>`;
    }
    function stageView(active, finished = false) {
      const label = finished ? '평가 정리' : active.turn > 0 ? '이해도 확인' : '대화 시작';
      const offset = finished ? 0 : active.turn > 2 ? 10 : active.turn > 0 ? 22 : 38;
      return `<span class="stage" role="img" aria-label="대략적인 진행 단계: ${label}" title="남은 질문 수가 아닌 대략적인 진행 단계입니다"><svg viewBox="0 0 20 20" aria-hidden="true"><circle class="ring-track" cx="10" cy="10" r="8"/><circle class="ring-fill" cx="10" cy="10" r="8" style="--offset:${offset}"/></svg>${label}</span>`;
    }
    function sourceView(attempt) {
      const task = tasks[attempt.taskId];
      return `<details class="source" ${page === 'assessment' && sourceOpen ? 'open' : ''}><summary>${page === 'result' ? '과제와 제출물 다시 보기' : '연결한 작업물 보기'}</summary><div class="source-body">${page === 'result' ? `<p class="task-note">${html(task.problem)}</p><ul class="requirements task-note">${task.requirements.map(item => `<li>${html(item)}</li>`).join('')}</ul>` : ''}<div class="source-meta"><span>${html(repositoryName(attempt.repo))}</span><code>${html(task.branch)}</code></div><div class="code-example"><div class="file-name">${html(task.file)} · 작업물 예시</div><pre><code>${html(task.sample)}</code></pre></div><p class="form-help">실제 저장소를 읽지 않은 예시입니다.</p></div></details>`;
    }
    function messageView(message) {
      return `<div class="message ${message.role === 'user' ? 'user' : 'ai'}"><div class="message-author">${message.role === 'user' ? '나의 설명' : '학습 파트너 · AI 예시'}</div><div class="message-text">${html(message.text)}</div></div>`;
    }
    function assessmentView() {
      const active = state.active;
      return `<button class="text-button back" data-go="task">과제 다시 보기</button><header class="assessment-heading"><h1>${html(tasks[active.taskId].concept)} · 이해도 확인</h1>${stageView(active)}</header><div class="chat-layout ${sourceOpen ? 'with-source' : ''}">${sourceView(active)}<section class="conversation" aria-label="이해도 확인 대화"><div class="chat-log" id="chat-log" role="log" aria-live="polite" aria-label="평가 대화">${active.messages.map(messageView).join('')}</div><form class="chat-form" id="chat-form"><label for="answer">나의 설명</label><textarea id="answer" name="answer" placeholder="작성한 내용의 흐름을 따라 설명해 주세요." required maxlength="5000">${html(active.draft)}</textarea><div class="chat-actions">${active.turn > 0 ? '<button class="text-button" type="button" data-action="finish">대화 마치고 피드백 보기</button>' : ''}<button class="primary" type="submit">답변 보내기</button></div></form></section></div>`;
    }
    function resultView() {
      const record = state.history.find(item => item.id === selectedRecord?.id);
      if (!record) return `<h1>기록을 찾을 수 없습니다.</h1><div class="home-actions"><button class="primary" data-go="history">학습 기록으로</button></div>`;
      const task = tasks[record.taskId];
      const pass = record.outcome === 'pass';
      const busy = Boolean(state.active);
      return `<button class="text-button back" data-go="${selectedRecord.fromHistory ? 'history' : 'home'}">${selectedRecord.fromHistory ? '기록으로 돌아가기' : '학습으로 돌아가기'}</button><h1 class="result-title">${html(task.title)}</h1><div class="result-status ${pass ? '' : 'fail'}"><strong>${pass ? 'PASS' : 'FAIL'}</strong><span>예시 평가 결과 · ${formatDate(record.date)}</span></div><p class="result-summary">${pass ? '핵심 개념을 이해하고 적용했습니다.' : '보완할 부분을 확인하고 다시 시도해 보세요.'}</p><div class="feedback-sections"><section><h2>잘 이해한 부분</h2><p>${html(task.understood)}</p></section><section><h2>${pass ? '더 살펴볼 부분' : '보완할 부분'}</h2><p>${html(task.improve)}</p></section><section><h2>${pass ? '이어서 배울 개념' : '다시 시도하는 방법'}</h2><p>${html(pass ? task.next : task.retry)}</p></section></div><div class="result-actions">${pass ? '<button class="primary" data-action="next-task">다음 과제 보기</button>' : busy ? '<button class="primary" data-action="resume">진행 중인 과제 이어가기</button>' : `<button class="primary" data-retry="${html(record.id)}">보완하고 다시 도전</button>`}<button class="text-button" data-go="history">학습 기록</button></div><details class="transcript"><summary>평가 대화 다시 보기</summary><div class="chat-log" aria-label="지난 평가 대화">${record.messages.map(messageView).join('')}</div></details>${sourceView(record)}<p class="form-help">입력한 답변을 실제로 채점한 결과는 아닙니다.</p>`;
    }
    function formatDate(value) {
      return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value));
    }
    function activityView() {
      const today = new Date();
      today.setHours(0,0,0,0);
      const start = new Date(today);
      start.setDate(start.getDate() - start.getDay() - 19*7);
      const days = {};
      for (const day of state.activity) days[day] = (days[day] || 0) + 1;
      const cells = Array.from({length:140}, (_,index) => {
        const day = new Date(start);
        day.setDate(day.getDate()+index);
        const count = days[localDay(day)] || 0;
        return `<span class="heat-cell ${day > today ? 'future' : ''}" data-level="${Math.min(count,3)}" title="${localDay(day)} · 학습 활동 ${count}회"></span>`;
      }).join('');
      return `<div class="history-activity"><div class="heatmap" role="img" aria-label="최근 20주 학습 활동. 칸의 색이 짙을수록 과제 수행과 평가 활동이 많습니다.">${cells}</div><div class="activity-dates"><span>${start.getMonth()+1}월 ${start.getDate()}일부터</span><span>오늘까지</span></div></div>`;
    }
    function historyView() {
      return `<h1>학습 기록</h1>${activityView()}${state.history.length ? `<div class="history-list">${[...state.history].reverse().map(record => `<button class="history-row" data-record="${html(record.id)}"><span class="history-title">${html(tasks[record.taskId].title)}</span><time datetime="${html(record.date)}">${new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit'}).format(new Date(record.date))}</time><span class="history-status ${record.outcome === 'fail' ? 'fail' : ''}">${record.outcome.toUpperCase()}</span></button>`).join('')}</div>` : `<p class="empty">아직 완료한 평가가 없습니다.<br>과제를 마치면 대화와 피드백을 여기서 다시 볼 수 있습니다.</p><div class="empty-action"><button class="text-button" data-go="home">학습하러 가기</button></div>`}`;
    }
    function newAttempt(taskId) {
      return { taskId, repo:state.repo, stage:'task', draft:'', messages:[], turn:0 };
    }
    function startTask(taskId) {
      if (!owns(tasks,taskId)) return;
      if (state.active) { go(state.active.stage === 'chat' ? 'assessment' : 'task'); return; }
      state.active = newAttempt(taskId);
      sourceOpen = false;
      markActivity();
      showCatalog = false;
      go('task');
    }
    function validRepository(value) {
      try {
        const url = new URL(value.trim());
        return url.protocol === 'https:' && url.hostname === 'github.com' && !url.port && !url.username && !url.password && !url.search && !url.hash && /^\/[a-zA-Z0-9_-]+\/[a-zA-Z0-9_.-]+\/?$/.test(url.pathname);
      } catch { return false; }
    }
    function repositoryName(value) {
      try { return new URL(value).pathname.replace(/^\//,'').replace(/\/$/,''); }
      catch { return value; }
    }
    function finish(outcome) {
      if (!state.active || state.active.stage !== 'chat') return;
      capture();
      if (state.active.draft.trim()) state.active.messages.push({role:'user',text:state.active.draft.trim()});
      state.active.draft = '';
      const record = JSON.parse(JSON.stringify(state.active));
      record.id = typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      record.outcome = outcome;
      record.date = new Date().toISOString();
      state.history.push(record);
      state.active = null;
      selectedTask = null;
      selectedRecord = {id:record.id,fromHistory:false};
      markActivity();
      go('result');
    }
    function loadDemo() {
      state = freshState();
      state.signedIn = true;
      state.profile = {purpose:'career',goal:'backend',experience:'experienced'};
      state.repo = 'https://github.com/jiwoo/cs-lab';
      for (const [taskId,outcome,ago] of [['http','pass',3],['semaphore','fail',1]]) {
        const date = new Date();
        date.setDate(date.getDate()-ago);
        state.history.push({...newAttempt(taskId),id:`demo-${taskId}`,stage:'chat',turn:1,messages:[{role:'ai',text:tasks[taskId].prompts[0]},{role:'user',text:taskId === 'http' ? '상태 코드는 처리 결과를, 본문은 실제 콘텐츠를 나타냅니다.' : '자리가 없으면 대기열에서 기다리고, release()에서 다음 요청을 깨웁니다.'},{role:'ai',text:tasks[taskId].prompts[1]}],outcome,date:date.toISOString()});
        state.activity.push(localDay(date));
      }
      state.active = newAttempt('semaphore');
      profileDraft = {...state.profile};
      selectedTask = null;
      selectedRecord = null;
      showCatalog = false;
      sourceOpen = false;
      go('home', false);
      notify('예시 학습자를 불러왔습니다.');
    }
    document.addEventListener('click', async event => {
      const route = event.target.closest('[data-go]');
      if (route) { event.preventDefault(); go(route.dataset.go); return; }
      const start = event.target.closest('[data-start]');
      if (start) { startTask(start.dataset.start); return; }
      const choose = event.target.closest('[data-choose]');
      if (choose) { selectedTask = choose.dataset.choose; showCatalog = false; go('home'); return; }
      const recordButton = event.target.closest('[data-record]');
      if (recordButton) { selectedRecord = {id:recordButton.dataset.record,fromHistory:true}; go('result'); return; }
      const retry = event.target.closest('[data-retry]');
      if (retry) { const record = state.history.find(item => item.id === retry.dataset.retry); if (record) startTask(record.taskId); return; }
      const outcome = event.target.closest('[data-outcome]');
      if (outcome) { finish(outcome.dataset.outcome); return; }
      const button = event.target.closest('[data-action]');
      if (!button) return;
      switch (button.dataset.action) {
        case 'login': state.signedIn = true; go(state.profile ? 'home' : 'onboarding'); break;
        case 'resume': if (state.active) go(state.active.stage === 'chat' ? 'assessment' : 'task'); break;
        case 'catalog':
          showCatalog = !showCatalog; render();
          (showCatalog ? document.querySelector('.catalog-row') : document.querySelector('[data-action="catalog"]'))?.focus({preventScroll:true});
          break;
        case 'edit-profile': profileDraft = {...state.profile}; go('onboarding'); break;
        case 'logout': capture(); state.signedIn = false; go('login'); break;
        case 'finish': finish('pass'); break;
        case 'next-task': selectedTask = null; showCatalog = false; go('home'); break;
        case 'demo': loadDemo(); break;
        case 'reset':
          clearTimeout(connectionTimer);
          state = freshState(); selectedTask = null; selectedRecord = null; showCatalog = false;
          profileDraft = {purpose:'',goal:'',experience:''};
          sourceOpen = false;
          go('login', false);
          break;
        case 'copy-branch':
          try { await navigator.clipboard.writeText(tasks[state.active.taskId].branch); notify('브랜치명을 복사했습니다.'); }
          catch { notify(`브랜치명: ${tasks[state.active.taskId].branch} — 직접 선택해 복사해 주세요.`); }
          break;
      }
    });
    document.addEventListener('input', event => {
      if (event.target.id === 'answer' && state.active) { state.active.draft = event.target.value; save(); }
      if (event.target.id === 'repo' && state.active) {
        state.active.repo = event.target.value;
        event.target.removeAttribute('aria-invalid');
        document.getElementById('repo-error').textContent = '';
        save();
      }
    });
    document.addEventListener('change', event => {
      if (page === 'onboarding' && ['purpose','goal','experience'].includes(event.target.id)) profileDraft[event.target.id] = event.target.value;
    });
    document.addEventListener('submit', event => {
      if (event.target.id === 'profile-form') {
        event.preventDefault(); capture();
        if (!validProfile(profileDraft)) return;
        state.profile = {...profileDraft}; selectedTask = null;
        go('home');
      }
      if (event.target.id === 'submit-form') {
        event.preventDefault(); if (connecting) return; capture();
        if (!validRepository(state.active.repo)) {
          const input = document.getElementById('repo');
          input.setAttribute('aria-invalid','true');
          document.getElementById('repo-error').textContent = 'https://github.com/사용자/저장소 형식의 주소를 입력하세요.';
          input.focus(); return;
        }
        state.active.repo = state.active.repo.trim(); state.repo = state.active.repo;
        connecting = true; save(); render();
        connectionTimer = setTimeout(() => {
          if (page !== 'task' || !state.active) return;
          state.active.stage = 'chat';
          if (!state.active.messages.length) state.active.messages = [{role:'ai',text:tasks[state.active.taskId].prompts[0]}];
          markActivity(); go('assessment');
        }, 650);
      }
      if (event.target.id === 'chat-form') {
        event.preventDefault(); capture();
        const active = state.active;
        const answer = active.draft.trim();
        if (!answer) return;
        active.messages.push({role:'user',text:answer});
        active.turn++;
        const prompts = tasks[active.taskId].prompts;
        active.messages.push({role:'ai',text:prompts[active.turn] || '같은 원리를 다른 상황에도 적용할 수 있을까요? 아직 설명하기 어려운 부분이나 더 확인하고 싶은 내용을 적어 주세요.'});
        active.draft = ''; markActivity(); save(); render();
        const log = document.getElementById('chat-log'); log.scrollTop = log.scrollHeight;
        document.getElementById('answer').focus({preventScroll:true});
      }
    });
    render();
  </script>
</body>
</html>
