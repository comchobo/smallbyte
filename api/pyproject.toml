[project]
name = "smallbyte-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlmodel>=0.0.24,<0.1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.15,<2",
    "pydantic-settings>=2.8,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "import-linter>=2.16,<3",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
    "ty>=0.0.1,<1",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ty.environment]
python-version = "3.13"

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Application layers"
type = "layers"
layers = [
    "app.routers",
    "app.services",
    "app.repositories",
    "app.models | app.schemas",
    "app.db",
    "app.config",
]
